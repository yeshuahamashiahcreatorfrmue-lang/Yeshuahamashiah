<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>7세력 전쟁 — 월드맵 RTS RPG</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
  #game { display:block; position:absolute; left:0; top:0; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:22px;
    background:rgba(5,7,12,0.94); color:#eef; text-align:center; z-index:10; overflow:auto; }
  .overlay h1 { font-size:23px; letter-spacing:1px; }
  .overlay h2 { font-size:30px; }
  .overlay p { font-size:13px; color:#9aa; line-height:1.6; max-width:360px; }
  .factions { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; width:100%; max-width:360px; }
  .fbtn { padding:11px; border:none; border-radius:11px; color:#fff; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,0.4); }
  .fbtn small { display:block; font-size:10px; font-weight:400; opacity:0.85; margin-top:2px; }
  .btn { padding:13px 28px; border:none; border-radius:13px; background:#3b82f6; color:#fff; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 3px 0 #1d4ed8; }
  #hud { position:absolute; left:0; top:0; right:0; padding:7px 10px; display:flex; justify-content:space-between; align-items:flex-start;
    color:#fff; font-size:12px; pointer-events:none; z-index:5; text-shadow:0 1px 2px #000; }
  #hud .panel { background:rgba(8,12,20,0.6); padding:6px 9px; border-radius:9px; }
  .bar { width:118px; height:6px; background:#333; border-radius:4px; margin-top:3px; overflow:hidden; }
  .lab { color:#9ab; font-size:10px; }
  #hint { position:absolute; left:10px; bottom:10px; color:#cde; font-size:11px; pointer-events:none; z-index:5; text-shadow:0 1px 2px #000; max-width:52%; }
  .hidden { display:none !important; }
  #townPanel { position:absolute; left:50%; transform:translateX(-50%); bottom:12px; z-index:8;
    background:rgba(10,14,24,0.94); border:1px solid #2a3550; border-radius:12px; padding:10px 12px; color:#eef; width:300px; max-width:92vw; }
  #townPanel h3 { font-size:14px; margin-bottom:6px; }
  #townPanel .row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:5px 0; font-size:12px; }
  #townPanel button { padding:6px 9px; border:none; border-radius:8px; background:#2563eb; color:#fff; font-size:12px; font-weight:700; cursor:pointer; }
  #townPanel button:disabled { background:#374151; color:#9aa; }
  #townPanel .close { position:absolute; right:8px; top:6px; background:none; color:#9ab; font-size:16px; padding:2px 6px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="panel">
    <div id="heroName">영웅</div>
    <div class="lab">병력</div><div class="bar"><div id="hpBar" style="height:100%;width:100%;background:#34d399"></div></div>
    <div class="lab" style="margin-top:2px">EXP (Lv <span id="lvl">1</span>)</div>
    <div class="bar"><div id="xpBar" style="height:100%;width:0;background:#fbbf24"></div></div>
    <div id="terr" class="lab" style="margin-top:3px"></div>
  </div>
  <div class="panel" style="text-align:right">
    <div>⚔️ 병력 <span id="troops">0</span></div>
    <div>💰 금 <span id="goldv">0</span></div>
    <div>🏰 성 <span id="castles">0</span>/<span id="castTot">0</span> <span id="status"></span></div>
    <div id="alive" style="color:#9ab"></div>
    <div id="clock" style="color:#9ab"></div>
  </div>
</div>
<div id="hint" class="hidden">드래그=이동 · 두손가락=확대 · 탭=이동/공격 · 내 성=마을(승선모드·항구·무역) · 내 함선 탭=함대조작 · 미니맵=점프</div>
<div id="townPanel" class="hidden"></div>

<div id="startScreen" class="overlay">
  <h1>⚔️ 7세력 전쟁 · 월드맵 ⚔️</h1>
  <p>7세력 · 충성 개인 7 · 무소속 7, 총 <b>21명의 군주</b>가 대륙을 다툰다.<br>
     <b>성을 가진 자만</b> 병력을 생산하는 '세력'이 되고, 성을 모두 잃으면 다시 떠도는 '개인'이 된다.<br>
     물은 <b>항구</b>가 있어야 건넌다.</p>
  <p style="color:#cde">플레이할 세력을 고르세요</p>
  <div class="factions" id="factionList"></div>
</div>

<div id="endScreen" class="overlay hidden">
  <h2 id="endTitle"></h2><p id="endMsg"></p>
  <button class="btn" onclick="location.reload()">다시 하기</button>
</div>

<script>
"use strict";
// ============================================================ 데이터
const FACTIONS = [
  { name:"빛의 군단",   hero:"세라핌",  color:"#f5d442" },
  { name:"어둠의 결사", hero:"녹스",    color:"#a855f7" },
  { name:"불꽃 부족",   hero:"이그니스",color:"#f97316" },
  { name:"서리 왕국",   hero:"글라키",  color:"#38bdf8" },
  { name:"대지 연맹",   hero:"테라",    color:"#84cc16" },
  { name:"폭풍 해적단", hero:"마엘",    color:"#3b82f6" },
  { name:"강철 제국",   hero:"펠릭스",  color:"#94a3b8" },
];
const LOYAL_NAMES=["근위대장 로엔","흑기사 가웨인","화염장군 드라코","서리검 한","대지수호 메이","해적두목 발드","강철검성 유리"];
const INDEP_NAMES=["떠돌이검객 카인","현상금사냥꾼 리라","방랑술사 오브","용병대장 그렌","그림자도적 시프","야만전사 보르","점성술사 셀레네"];
const INDEP_COLORS=["#e879f9","#fb7185","#22d3ee","#facc15","#4ade80","#fb923c","#c084fc"];
const REGION_PREFIX=["여명","흑요","북풍","비취","철광","안개","선혈","황금","적막"];
const TIER_COLOR=["#b08d57","#cbd5e1","#fcd34d","#fca5a5","#c084fc","#fb7185"]; // 병력 규모 등급색
// 지형: 0바다1강2사막3평지4초원5진흙6산맥7설산 (이동속도/방어:피해배율/이름) — 0,1은 도보 불가
const TERR=[ {spd:0.40,def:1.30,name:"바다"},{spd:0.60,def:1.20,name:"강"},{spd:0.85,def:1.00,name:"사막"},
  {spd:1.18,def:1.12,name:"평지"},{spd:1.00,def:0.90,name:"초원/숲"},{spd:0.58,def:0.95,name:"진흙"},
  {spd:0.55,def:0.66,name:"산맥"},{spd:0.70,def:0.74,name:"설산"} ];
// 경제/해상 상수
const BR=9, GR=2.2, MOVE=86, KILL=0.032;
const SHIP_BASE=1700, NAVY_BONUS=1.42, BOARD=95, PCD=10; // 함선기본전투력 / 해군+42% / 승선거리 / 재출항쿨다운
const COST={barracks:l=>60*l, farm:l=>50*l, port:90, shipyard:160, passenger:70, post:40};

const WORLD_W=1280, WORLD_H=1920;
const GCELL=24, GCOLS=Math.ceil(WORLD_W/GCELL), GROWS=Math.ceil(WORLD_H/GCELL);
const RS=8;

// ============================================================ 캔버스 & 카메라
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let cam={x:0,y:0,zoom:1}, minZoom=0.2, maxZoom=3;
function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; minZoom=Math.min(cv.width/WORLD_W, cv.height/WORLD_H); clampCam(); }
window.addEventListener('resize',resize);
function clampCam(){ cam.zoom=Math.max(minZoom,Math.min(maxZoom,cam.zoom)); const vw=cv.width/cam.zoom, vh=cv.height/cam.zoom;
  cam.x = vw>=WORLD_W ? (WORLD_W-vw)/2 : Math.max(0,Math.min(WORLD_W-vw,cam.x));
  cam.y = vh>=WORLD_H ? (WORLD_H-vh)/2 : Math.max(0,Math.min(WORLD_H-vh,cam.y)); }
function s2w(sx,sy){ return { x:sx/cam.zoom+cam.x, y:sy/cam.zoom+cam.y }; }

// ============================================================ 노이즈
function hash2(ix,iy){ let n=(Math.imul(ix,374761393)+Math.imul(iy,668265263))|0; n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967295; }
function smooth(t){ return t*t*(3-2*t); }
function vnoise(x,y){ const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0; const a=hash2(x0,y0),b=hash2(x0+1,y0),c=hash2(x0,y0+1),d=hash2(x0+1,y0+1); const u=smooth(fx),v=smooth(fy); return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v; }
function fbm(x,y){ let s=0,a=0.5,f=1; for(let i=0;i<4;i++){ s+=a*vnoise(x*f,y*f); f*=2; a*=0.5; } return s/0.9375; }
function smoothstep(a,b,x){ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); }
let nOX=0,nOY=0,nMX=0,nMY=0;
function sample(wx,wy){ let e=fbm(wx/360+nOX, wy/360+nOY); const ex=Math.abs(wx/WORLD_W*2-1), ey=Math.abs(wy/WORLD_H*2-1);
  e -= smoothstep(0.5,1.0,Math.max(ex,ey))*0.62; const m=fbm(wx/250+nMX, wy/250+nMY); return {e,m}; }
function typeEM(e,m){ if(e<0.30)return 0; if(e<0.345)return 1; if(e<0.375)return 2; if(e>0.80)return 7; if(e>0.70)return 6; if(m<0.33)return 2; if(m<0.47)return 3; if(m<0.70)return 4; return 5; }

// ============================================================ 색/사전렌더/지형
function lerp(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
const C={ deep:[15,42,74],sea:[28,86,140],shal:[52,132,170],beach:[214,196,142],desert:[206,184,116],plains:[176,188,112],grass:[92,156,80],mud:[104,92,58],rock:[122,114,104],rockD:[88,82,74],snow:[212,222,234] };
function colEM(e,m){ let c; if(e<0.30)c=lerp(C.deep,C.sea,e/0.30); else if(e<0.345)c=lerp(C.sea,C.shal,(e-0.30)/0.045);
  else if(e<0.375)c=lerp(C.shal,C.beach,(e-0.345)/0.03); else if(e>0.80)c=C.snow; else if(e>0.70)c=lerp(C.rock,C.rockD,(e-0.70)/0.10);
  else if(m<0.33)c=lerp(C.beach,C.desert,m/0.33); else if(m<0.47)c=lerp(C.desert,C.plains,(m-0.33)/0.14);
  else if(m<0.70)c=lerp(C.plains,C.grass,(m-0.47)/0.23); else c=lerp(C.grass,C.mud,(m-0.70)/0.30); return c; }
function clamp255(v){ return v<0?0:v>255?255:v|0; }
function biomeName(t){ return t<2?'해안':t===2?'사막':t===3?'평원':t===4?'삼림':t===5?'늪지':t===6?'산맥':'설원'; }

let grid=new Uint8Array(GCOLS*GROWS);
let landId=new Int16Array(GCOLS*GROWS);
let bg=document.createElement('canvas'); bg.width=WORLD_W; bg.height=WORLD_H;
let mm=document.createElement('canvas'); const MMW=110, MMH=Math.round(MMW*WORLD_H/WORLD_W); mm.width=MMW; mm.height=MMH;
let regions=[];
function regionAt(wx,wy){ let bi=0,bd=1e18; for(let i=0;i<regions.length;i++){ const dx=regions[i].x-wx,dy=regions[i].y-wy,d=dx*dx+dy*dy; if(d<bd){bd=d;bi=i;} } return bi; }
function terrAt(wx,wy){ const cx=Math.max(0,Math.min(GCOLS-1,(wx/GCELL)|0)), cy=Math.max(0,Math.min(GROWS-1,(wy/GCELL)|0)); return grid[cy*GCOLS+cx]; }
function landAt(wx,wy){ const cx=Math.max(0,Math.min(GCOLS-1,(wx/GCELL)|0)), cy=Math.max(0,Math.min(GROWS-1,(wy/GCELL)|0)); return landId[cy*GCOLS+cx]; }
function randLand(){ for(let i=0;i<500;i++){ const x=50+Math.random()*(WORLD_W-100), y=50+Math.random()*(WORLD_H-100); if(terrAt(x,y)>=2) return {x,y}; } return {x:WORLD_W/2,y:WORLD_H/2}; }
function isCoastalCell(cx,cy){ for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ const nx=cx+dx,ny=cy+dy; if(nx<0||nx>=GCOLS||ny<0||ny>=GROWS)continue; if(grid[ny*GCOLS+nx]<2) return true; } return false; }

function computeLand(){ landId.fill(-1); let id=0; const st=[];
  for(let cy=0;cy<GROWS;cy++) for(let cx=0;cx<GCOLS;cx++){ const i=cy*GCOLS+cx;
    if(grid[i]>=2 && landId[i]===-1){ landId[i]=id; st.length=0; st.push(i);
      while(st.length){ const p=st.pop(), px=p%GCOLS, py=(p/GCOLS)|0;
        const nb=[[px+1,py],[px-1,py],[px,py+1],[px,py-1]];
        for(const[a,b]of nb){ if(a<0||a>=GCOLS||b<0||b>=GROWS)continue; const q=b*GCOLS+a; if(grid[q]>=2&&landId[q]===-1){ landId[q]=id; st.push(q);} } }
      id++; } } }

function genWorld(){
  nOX=Math.random()*1000; nOY=Math.random()*1000; nMX=Math.random()*1000+50; nMY=Math.random()*1000+50;
  for(let cy=0;cy<GROWS;cy++) for(let cx=0;cx<GCOLS;cx++){ const s=sample(cx*GCELL+GCELL/2, cy*GCELL+GCELL/2); grid[cy*GCOLS+cx]=typeEM(s.e,s.m); }
  computeLand();
  regions=[]; const pts=[]; for(let i=0;i<300;i++) pts.push(randLand());
  const chosen=[0]; while(chosen.length<7){ let bi=0,bd=-1; for(let i=0;i<pts.length;i++){ if(chosen.includes(i))continue; let md=1e18;
    for(const c of chosen) md=Math.min(md,Math.hypot(pts[i].x-pts[c].x,pts[i].y-pts[c].y)); if(md>bd){bd=md;bi=i;} } chosen.push(bi); }
  const used=new Set();
  chosen.forEach(ci=>{ const p=pts[ci]; const cnt={}; for(let dy=-3;dy<=3;dy++) for(let dx=-3;dx<=3;dx++){ const tt=terrAt(p.x+dx*GCELL,p.y+dy*GCELL); if(tt<2)continue; cnt[tt]=(cnt[tt]||0)+1; }
    let dom=4,mx=-1; for(const k in cnt){ if(cnt[k]>mx){mx=cnt[k];dom=+k;} }
    let pre; do{ pre=REGION_PREFIX[(Math.random()*REGION_PREFIX.length)|0]; }while(used.has(pre)); used.add(pre);
    regions.push({x:p.x,y:p.y,name:pre+' '+biomeName(dom)}); });
  const bx=bg.getContext('2d');
  for(let y=0;y<WORLD_H;y+=RS) for(let x=0;x<WORLD_W;x+=RS){
    const cx=x+RS/2, cy=y+RS/2, s=sample(cx,cy), c=colEM(s.e,s.m); const j=(hash2(x*3+1,y*3+7)-0.5)*18;
    bx.fillStyle=`rgb(${clamp255(c[0]+j)},${clamp255(c[1]+j)},${clamp255(c[2]+j)})`; bx.fillRect(x,y,RS+1,RS+1);
    const t=typeEM(s.e,s.m), h=hash2(x*7+3,y*5+11);
    if(t>=6&&h<0.55) deco_mtn(bx,cx,cy,t); else if(t===4&&h<0.12) deco_tree(bx,cx,cy); else if(t===2&&s.e>0.375&&h<0.07) deco_dune(bx,cx,cy);
    if(t>=2){ const r0=regionAt(cx,cy); if(regionAt(cx+RS,cy)!==r0){ bx.fillStyle='rgba(25,18,12,0.30)'; bx.fillRect(x+RS-1,y,2,RS+1); } if(regionAt(cx,cy+RS)!==r0){ bx.fillStyle='rgba(25,18,12,0.30)'; bx.fillRect(x,y+RS-1,RS+1,2); } }
  }
  mm.getContext('2d').drawImage(bg,0,0,MMW,MMH);
}
function deco_mtn(bx,cx,cy,t){ const s=RS*0.85; bx.fillStyle='#5e574e'; bx.beginPath(); bx.moveTo(cx-s,cy+s*0.7); bx.lineTo(cx,cy-s); bx.lineTo(cx+s,cy+s*0.7); bx.closePath(); bx.fill();
  bx.fillStyle='rgba(255,255,255,0.18)'; bx.beginPath(); bx.moveTo(cx-s,cy+s*0.7); bx.lineTo(cx,cy-s); bx.lineTo(cx-s*0.2,cy+s*0.7); bx.closePath(); bx.fill();
  if(t===7){ bx.fillStyle='#eef3fa'; bx.beginPath(); bx.moveTo(cx-s*0.35,cy-s*0.2); bx.lineTo(cx,cy-s); bx.lineTo(cx+s*0.35,cy-s*0.2); bx.closePath(); bx.fill(); } }
function deco_tree(bx,cx,cy){ bx.fillStyle='#5b4327'; bx.fillRect(cx-1,cy,2,RS*0.4); bx.fillStyle='#3c6b37'; bx.beginPath(); bx.arc(cx,cy-RS*0.15,RS*0.5,0,7); bx.fill(); bx.fillStyle='rgba(255,255,255,0.10)'; bx.beginPath(); bx.arc(cx-RS*0.12,cy-RS*0.25,RS*0.22,0,7); bx.fill(); }
function deco_dune(bx,cx,cy){ bx.strokeStyle='rgba(232,216,162,0.45)'; bx.lineWidth=1.4; bx.beginPath(); bx.arc(cx,cy+RS*0.4,RS*0.7,Math.PI*1.15,Math.PI*1.85); bx.stroke(); }

// ============================================================ 게임 상태
let state='select', playerIdx=0, units=[], castles=[], playerUnit=null;
let elapsed=0, lastT=0, aiTimer=0, upTimer=0, ended=false;
let gold={}, TS={}, warCD={}, selFleet=null; // 팀별 금 / 집계 / 전함스폰쿨다운 / 플레이어 선택 함대
function teamColor(team){ if(team<0) return '#8a93a3'; if(team<7) return FACTIONS[team].color; return INDEP_COLORS[team-100]; }
function makeUnit(o){ return Object.assign({ x:0,y:0,tx:0,ty:0, alive:true, troops:420, lvl:1,xp:0,xpNeed:500, atk:10, targetU:null, capProg:0, capC:null, lastLand:0, atSea:false,
  naval:false, shipType:null, crew:'land', ferryUntil:0, wt:0,
  laden:false, cargo:0, homePort:null, homePost:null, originPort:null, manualTarget:null, cargoMul:1, escort:0 },o); }
let navalTimer=0;
function nearestWater(x,y){ for(let rad=GCELL; rad<400; rad+=GCELL){ for(let a=0;a<8;a++){ const ang=a/8*Math.PI*2, nx=x+Math.cos(ang)*rad, ny=y+Math.sin(ang)*rad; if(nx>0&&nx<WORLD_W&&ny>0&&ny<WORLD_H&&terrAt(nx,ny)<2) return {x:nx,y:ny}; } } return null; }
function randWater(){ for(let i=0;i<300;i++){ const x=Math.random()*WORLD_W, y=Math.random()*WORLD_H; if(terrAt(x,y)<2) return {x,y}; } return null; }

function computeTS(){ const t={}; for(const c of castles){ if(c.owner<0) continue; const s=t[c.owner]||(t[c.owner]={towns:0,barr:0,farm:0,port:false,ship:false,nyard:0,npost:0});
  s.towns++; s.barr+=c.barracks; s.farm+=c.farm; if(c.port)s.port=true; if(c.shipyard){s.ship=true;s.nyard++;} if(c.tradePost)s.npost++; } return t; }
function isShip(u){ return u.naval; }                 // 물 위 함선(수송/전함/유람선)
function isCarrier(u){ return u.shipType==='passenger'||u.kind==='courier'; } // 비전투 교역 운반체
function isArmy(u){ return u.kind==='faction'||u.kind==='loyal'||u.kind==='indep'; }
function isPower(team){ return !!(TS[team] && TS[team].towns>0); }
function capMaxOf(team){ const s=TS[team]; return s? 2000+s.barr*4000 : 1500; }

function startGame(idx){
  playerIdx=idx; genWorld();
  castles=[]; const cand=[]; for(let i=0;i<700;i++) cand.push(randLand());
  for(const p of cand){ if(castles.length>=18)break; if(castles.every(c=>Math.hypot(c.x-p.x,c.y-p.y)>210)){
    const cx=(p.x/GCELL)|0, cy=(p.y/GCELL)|0;
    castles.push({x:p.x,y:p.y,r:30,owner:-1,barracks:1,farm:1,port:false,shipyard:false,coastal:isCoastalCell(cx,cy),land:landAt(p.x,p.y),
      embarkMode:'transport', passengerMax:1, tradePost:false, route:null, pCD:0, cCD:0}); } }
  const homeIdx=[0]; while(homeIdx.length<7){ let bi=0,bd=-1; for(let i=0;i<castles.length;i++){ if(homeIdx.includes(i))continue; let md=1e18;
    for(const c of homeIdx) md=Math.min(md,Math.hypot(castles[i].x-castles[c].x,castles[i].y-castles[c].y)); if(md>bd){bd=md;bi=i;} } homeIdx.push(bi); }
  homeIdx.forEach((ci,f)=>castles[ci].owner=f);
  gold={}; for(let i=0;i<7;i++) gold[i]=120; for(let i=0;i<7;i++) gold[100+i]=40; warCD={}; navalTimer=0; selFleet=null;

  units=[];
  homeIdx.forEach((ci,f)=>{ const h=castles[ci];
    units.push(makeUnit({kind:'faction',team:f,name:FACTIONS[f].hero,fac:FACTIONS[f].name,color:FACTIONS[f].color,x:h.x,y:h.y,tx:h.x,ty:h.y,troops:4200,atk:18,lastLand:h.land}));
    units.push(makeUnit({kind:'loyal',team:f,name:LOYAL_NAMES[f],fac:FACTIONS[f].name,color:FACTIONS[f].color,x:h.x+45,y:h.y+45,tx:h.x+45,ty:h.y+45,troops:840,atk:11,lastLand:h.land})); });
  for(let i=0;i<7;i++){ const p=randLand(); units.push(makeUnit({kind:'indep',team:100+i,name:INDEP_NAMES[i],fac:'무소속',color:INDEP_COLORS[i],x:p.x,y:p.y,tx:p.x,ty:p.y,troops:420,atk:12,lastLand:landAt(p.x,p.y)})); }
  TS=computeTS();
  playerUnit=units.find(u=>u.kind==='faction'&&u.team===idx);
  cam.zoom=Math.min(maxZoom,minZoom*1.8); cam.x=playerUnit.x-cv.width/cam.zoom/2; cam.y=playerUnit.y-cv.height/cam.zoom/2; clampCam();
  elapsed=0; ended=false; state='play'; lastT=performance.now();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  document.getElementById('heroName').textContent=FACTIONS[idx].name+' · '+FACTIONS[idx].hero;
  document.getElementById('castTot').textContent=castles.length;
  requestAnimationFrame(loop);
}

// ============================================================ 입력
let drag={on:false,moved:false,lx:0,ly:0,sx:0,sy:0,st:0}, pinch={on:false,d:0}, mmDrag=false;
function dist2(a,b){ return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); }
function mmRect(){ return {x:cv.width-MMW-8, y:cv.height-MMH-8, w:MMW, h:MMH}; }
function inMM(sx,sy){ const r=mmRect(); return sx>=r.x&&sx<=r.x+r.w&&sy>=r.y&&sy<=r.y+r.h; }
function mmJump(sx,sy){ const r=mmRect(); cam.x=(sx-r.x)/r.w*WORLD_W-cv.width/cam.zoom/2; cam.y=(sy-r.y)/r.h*WORLD_H-cv.height/cam.zoom/2; clampCam(); }
cv.addEventListener('touchstart',e=>{ e.preventDefault();
  if(e.touches.length===1){ const t=e.touches[0]; if(inMM(t.clientX,t.clientY)){ mmDrag=true; mmJump(t.clientX,t.clientY); return; }
    drag={on:true,moved:false,lx:t.clientX,ly:t.clientY,sx:t.clientX,sy:t.clientY,st:performance.now()}; pinch.on=false; }
  else if(e.touches.length===2){ pinch={on:true,d:dist2(e.touches[0],e.touches[1])}; drag.on=false; mmDrag=false; } },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault();
  if(mmDrag&&e.touches.length===1){ mmJump(e.touches[0].clientX,e.touches[0].clientY); return; }
  if(pinch.on&&e.touches.length>=2){ const nd=dist2(e.touches[0],e.touches[1]); zoomAt((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2, nd/pinch.d); pinch.d=nd; }
  else if(drag.on&&e.touches.length===1){ const t=e.touches[0]; panBy(t.clientX-drag.lx,t.clientY-drag.ly); if(Math.hypot(t.clientX-drag.sx,t.clientY-drag.sy)>10) drag.moved=true; drag.lx=t.clientX; drag.ly=t.clientY; } },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); if(drag.on&&!drag.moved&&performance.now()-drag.st<320&&e.touches.length===0) tap(drag.sx,drag.sy); if(e.touches.length===0){ drag.on=false; pinch.on=false; mmDrag=false; } },{passive:false});
cv.addEventListener('mousedown',e=>{ if(inMM(e.clientX,e.clientY)){ mmDrag=true; mmJump(e.clientX,e.clientY); return; } drag={on:true,moved:false,lx:e.clientX,ly:e.clientY,sx:e.clientX,sy:e.clientY,st:performance.now()}; });
cv.addEventListener('mousemove',e=>{ if(mmDrag){ mmJump(e.clientX,e.clientY); return; } if(drag.on){ panBy(e.clientX-drag.lx,e.clientY-drag.ly); if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6) drag.moved=true; drag.lx=e.clientX; drag.ly=e.clientY; } });
cv.addEventListener('mouseup',e=>{ if(!mmDrag&&drag.on&&!drag.moved) tap(e.clientX,e.clientY); drag.on=false; mmDrag=false; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, e.deltaY<0?1.12:0.89); },{passive:false});
function panBy(dx,dy){ cam.x-=dx/cam.zoom; cam.y-=dy/cam.zoom; clampCam(); }
function zoomAt(fx,fy,f){ const w=s2w(fx,fy); cam.zoom=Math.max(minZoom,Math.min(maxZoom,cam.zoom*f)); cam.x=w.x-fx/cam.zoom; cam.y=w.y-fy/cam.zoom; clampCam(); }
function tap(sx,sy){ if(state!=='play'||!playerUnit.alive) return; const w=s2w(sx,sy);
  // 내 성 → 마을 관리
  for(const c of castles){ if(c.owner===playerIdx && Math.hypot(c.x-w.x,c.y-w.y)<c.r+6){ openTown(c); return; } }
  closeTown();
  // 내 본대 탭 → 함대 선택 해제(본대 조종)
  if(Math.hypot(playerUnit.x-w.x,playerUnit.y-w.y)<radiusOf(playerUnit)+10/cam.zoom){ selFleet=null; return; }
  // 내 함선 탭 → 함대 선택(전함+유람선 묶음)
  for(const u of units){ if(u.alive&&u.team===playerIdx&&(u.shipType==='warship'||u.shipType==='passenger')&&Math.hypot(u.x-w.x,u.y-w.y)<radiusOf(u)+12/cam.zoom){
    selFleet=units.filter(o=>o.alive&&o.team===playerIdx&&(o.shipType==='warship'||o.shipType==='passenger')&&Math.hypot(o.x-u.x,o.y-u.y)<150); return; } }
  // 함대 선택 중이면 함대에 명령(전함=이동/교전, 유람선=경로 수정)
  if(selFleet&&selFleet.length){ let k=0; for(const s of selFleet){ if(!s.alive)continue; const off=k*14; s.manualTarget={x:Math.max(10,Math.min(WORLD_W-10,w.x+off)),y:w.y}; s.tx=s.manualTarget.x; s.ty=s.manualTarget.y; k++; } return; }
  // 본대 명령
  let target=null,best=40/cam.zoom;
  for(const u of units){ if(!u.alive||u.team===playerUnit.team||isCarrier(u)) continue; const d=Math.hypot(u.x-w.x,u.y-w.y); if(d<best){best=d;target=u;} }
  if(target){ playerUnit.targetU=target; playerUnit.tx=target.x; playerUnit.ty=target.y; }
  else { playerUnit.targetU=null; playerUnit.tx=Math.max(10,Math.min(WORLD_W-10,w.x)); playerUnit.ty=Math.max(10,Math.min(WORLD_H-10,w.y)); } }

// ============================================================ 마을 관리 UI
const tp=document.getElementById('townPanel'); let openC=null;
function openTown(c){ openC=c; renderTown(); tp.classList.remove('hidden'); }
function closeTown(){ openC=null; tp.classList.add('hidden'); }
function renderTown(){ const c=openC; if(!c){ closeTown(); return; } const g=Math.floor(gold[playerIdx]||0);
  const canPort=c.coastal&&!c.port, canShip=c.port&&!c.shipyard;
  tp.innerHTML=`<button class="close" onclick="closeTown()">✕</button>
   <h3>🏰 마을 관리 · 금 ${g}</h3>
   <div class="row"><span>🏹 병영 Lv${c.barracks} (병력생산↑)</span><button ${g<COST.barracks(c.barracks)?'disabled':''} onclick="upg('b')">강화 ${COST.barracks(c.barracks)}</button></div>
   <div class="row"><span>🌾 농지 Lv${c.farm} (금 수익↑)</span><button ${g<COST.farm(c.farm)?'disabled':''} onclick="upg('f')">강화 ${COST.farm(c.farm)}</button></div>
   <div class="row"><span>⚓ 항구 ${c.port?'✔ 도하':(c.coastal?'':'(해안 아님)')}</span>${c.port?'':`<button ${(!canPort||g<COST.port)?'disabled':''} onclick="upg('p')">건설 ${COST.port}</button>`}</div>
   ${c.port?`<div class="row"><span>🛳 승선모드: <b>${c.embarkMode==='warship'?'전함':'수송선'}</b></span><button onclick="upg('mode')">전환</button></div>
   <div class="row"><span>🛥 유람선 ${c.passengerMax}/7 (교역)</span><button ${(c.passengerMax>=7||g<COST.passenger)?'disabled':''} onclick="upg('pm')">증선 ${COST.passenger}</button></div>`:''}
   <div class="row"><span>🚢 조선소 ${c.shipyard?'✔ 전함건조':''}</span>${c.shipyard?'':`<button ${(!canShip||g<COST.shipyard)?'disabled':''} onclick="upg('s')">건조 ${COST.shipyard}</button>`}</div>
   <div class="row"><span>🐎 기마무역소 ${c.tradePost?'✔ 육상교역':''}</span>${c.tradePost?'':`<button ${g<COST.post?'disabled':''} onclick="upg('tp')">건설 ${COST.post}</button>`}</div>`; }
function upg(t){ const c=openC; if(!c) return; let cost=0;
  if(t==='b'){ cost=COST.barracks(c.barracks); if(gold[playerIdx]>=cost){ gold[playerIdx]-=cost; c.barracks++; } }
  else if(t==='f'){ cost=COST.farm(c.farm); if(gold[playerIdx]>=cost){ gold[playerIdx]-=cost; c.farm++; } }
  else if(t==='p'){ if(c.coastal&&!c.port&&gold[playerIdx]>=COST.port){ gold[playerIdx]-=COST.port; c.port=true; } }
  else if(t==='s'){ if(c.port&&!c.shipyard&&gold[playerIdx]>=COST.shipyard){ gold[playerIdx]-=COST.shipyard; c.shipyard=true; } }
  else if(t==='mode'){ c.embarkMode = c.embarkMode==='warship'?'transport':'warship'; }
  else if(t==='pm'){ if(c.port&&c.passengerMax<7&&gold[playerIdx]>=COST.passenger){ gold[playerIdx]-=COST.passenger; c.passengerMax++; } }
  else if(t==='tp'){ if(!c.tradePost&&gold[playerIdx]>=COST.post){ gold[playerIdx]-=COST.post; c.tradePost=true; } }
  TS=computeTS(); renderTown(); }
window.closeTown=closeTown; window.upg=upg;

// ============================================================ 시뮬레이션
function radiusOf(u){ if(isShip(u)||u.kind==='courier') return 10; return 8 + Math.min(26, Math.log10(u.troops+10)*5); }
// 전투력: 해상은 함선 성능 기준(해군 전함 ×1.42, 즉석 전함=함선기본, 수송선 절반, 교역선 0)
function effPower(u){
  if(u.shipType==='warship') return u.crew==='navy' ? u.troops*(1+u.lvl*0.06)*NAVY_BONUS+300 : SHIP_BASE;
  if(u.shipType==='transport') return SHIP_BASE*0.5;
  if(isCarrier(u)) return 0;
  return u.troops*(1+u.lvl*0.06)+u.atk*4;
}
function teamHasPort(team){ return !!(TS[team]&&TS[team].port); }
function canCrossStrat(u){ return teamHasPort(u.team) || u.ferryUntil>elapsed; } // AI 도달성 판정
function reachable(u,x,y){ if(canCrossStrat(u)) return true; return landAt(x,y)===u.lastLand; }
// 육군이 물에 들어갈 때 탑승할 배 종류(아군 항구=승선모드 / 개인=유람선 ferry)
function boardType(u){
  let bp=null,bd=BOARD; for(const c of castles){ if(c.port&&c.owner===u.team){ const d=Math.hypot(c.x-u.x,c.y-u.y); if(d<bd){bd=d;bp=c;} } }
  if(bp) return bp.embarkMode||'transport';
  if(u.ferryUntil>elapsed) return 'transport';
  return null;
}

function ai(u){ if(u===playerUnit) return;
  if(u.shipType==='warship' && u.crew==='navy'){ aiWarship(u); return; }
  if(isCarrier(u)) return;                       // 교역선은 updateTrade가 조종
  // 육군/상륙군 일반 AI
  if(u.targetU&&u.targetU.alive&&u.targetU.team!==u.team&&Math.hypot(u.targetU.x-u.x,u.targetU.y-u.y)<90){ u.tx=u.targetU.x; u.ty=u.targetU.y; return; }
  u.targetU=null; let weak=null,wd=320;
  for(const o of units){ if(!o.alive||o.team===u.team||isCarrier(o))continue; if(!reachable(u,o.x,o.y))continue; const d=Math.hypot(o.x-u.x,o.y-u.y); if(d<wd&&effPower(o)<effPower(u)*1.1){wd=d;weak=o;} }
  let tc=null,cd=1e9; for(const c of castles){ if(c.owner===u.team)continue; if(!reachable(u,c.x,c.y))continue; const d=Math.hypot(c.x-u.x,c.y-u.y); if(d<cd){cd=d;tc=c;} }
  if(weak&&wd<200){ u.targetU=weak; u.tx=weak.x; u.ty=weak.y; } else if(tc){ u.tx=tc.x; u.ty=tc.y; } else { u.tx=u.x; u.ty=u.y; } }
function aiWarship(u){ // 가장 가까운 적 함선/교역선 사냥, 없으면 모항 주변 순찰
  let t=null,td=520; for(const o of units){ if(!o.alive||o.team===u.team) continue; if(!isShip(o)) continue; const d=Math.hypot(o.x-u.x,o.y-u.y); if(d<td){td=d;t=o;} }
  if(t){ u.tx=t.x; u.ty=t.y; return; }
  if(!u.homePort||u.homePort.owner!==u.team){ const p=castles.find(c=>c.port&&c.owner===u.team); u.homePort=p||u.homePort; }
  if(u.homePort){ const w=nearestWater(u.homePort.x,u.homePort.y); if(w){ u.wt-=0.5; if(u.wt<=0||Math.hypot(u.x-u.tx,u.y-u.ty)<12){ u.wt=3; const a=Math.random()*7; u.tx=w.x+Math.cos(a)*70; u.ty=w.y+Math.sin(a)*70; } } } }

function aiUpgrade(){ for(let team in TS){ if(+team===playerIdx) continue; const s=TS[team]; if(!s||s.towns===0) continue;
  let g=gold[team]||0; const tnum=+team; const towns=castles.filter(c=>c.owner===tnum);
  const needNaval=castles.some(c=>c.owner!==tnum && c.land!==towns[0].land);
  if(needNaval && !s.port){ const ct=towns.find(c=>c.coastal&&!c.port); if(ct&&g>=COST.port){ g-=COST.port; ct.port=true;
      if(Math.random()<0.5){ ct.embarkMode='transport'; } } }
  if(s.port && !s.ship && needNaval && g>=COST.shipyard){ const ct=towns.find(c=>c.port&&!c.shipyard); if(ct){ g-=COST.shipyard; ct.shipyard=true; } }
  for(const c of towns){ if(g>=COST.farm(c.farm)&&c.farm<=c.barracks){ g-=COST.farm(c.farm); c.farm++; }
    else if(g>=COST.barracks(c.barracks)){ g-=COST.barracks(c.barracks); c.barracks++; } }
  gold[team]=g; } TS=computeTS(); }

// 함선 스폰(전함·유람선·기마병참원) — 격침 후 쿨다운 뒤 재출항
function spawnNaval(interval){
  for(const c of castles){ if(c.owner<0) continue;
    if(c.port){ c.pCD=Math.max(0,c.pCD-interval); const have=units.filter(u=>u.alive&&u.shipType==='passenger'&&u.homePort===c).length;
      if(have<(c.passengerMax||1) && c.pCD<=0){ const w=nearestWater(c.x,c.y); if(w){ units.push(makeUnit({kind:'passenger',shipType:'passenger',naval:true,team:c.owner,name:'유람선',color:teamColor(c.owner),x:w.x,y:w.y,tx:w.x,ty:w.y,troops:320,atk:0,homePort:c,originPort:c})); c.pCD=PCD; } } }
    if(c.tradePost){ c.cCD=Math.max(0,c.cCD-interval); const have=units.filter(u=>u.alive&&u.kind==='courier'&&u.homePost===c).length;
      if(have<1 && c.cCD<=0){ units.push(makeUnit({kind:'courier',shipType:'courier',naval:false,team:c.owner,name:'기마병참원',color:teamColor(c.owner),x:c.x,y:c.y,tx:c.x,ty:c.y,troops:240,atk:0,homePost:c,cargoMul:1+Math.min(42-1,Math.floor((c.escort||0)/100)*0.1)})); c.cCD=PCD; } } }
  for(const team in TS){ const s=TS[team]; if(!s.ship) continue; const tn=+team;
    const desired=Math.min(2,s.nyard); const have=units.filter(u=>u.alive&&u.shipType==='warship'&&u.crew==='navy'&&u.team===tn).length;
    warCD[tn]=Math.max(0,(warCD[tn]||0)-interval);
    if(have<desired && warCD[tn]<=0){ const yard=castles.find(c=>c.owner===tn&&c.shipyard); const w=yard&&nearestWater(yard.x,yard.y);
      if(w){ units.push(makeUnit({kind:'warship',shipType:'warship',crew:'navy',naval:true,team:tn,name:'전함',color:teamColor(tn),x:w.x,y:w.y,tx:w.x,ty:w.y,troops:1100,atk:30,homePort:yard})); warCD[tn]=PCD*1.5; } } }
}

// 교역(유람선=해상 항구왕복 / 기마병참원=육상 무역소왕복): 적재→자기거점 귀환 시 수익
function updateTrade(dt){
  for(const u of units){ if(!u.alive||!isCarrier(u)) continue;
    const sea=u.shipType==='passenger';
    const nodes = sea ? castles.filter(c=>c.port) : castles.filter(c=>c.tradePost);
    if(u.manualTarget){ u.tx=u.manualTarget.x; u.ty=u.manualTarget.y; if(Math.hypot(u.x-u.tx,u.y-u.ty)<14) u.manualTarget=null; continue; }
    if(!u.laden){ // 다른 거점으로 가서 적재(적지면 약탈치↑)
      let best=null,bd=1e9; for(const c of nodes){ if(c===u.originPort) continue; const d=Math.hypot(c.x-u.x,c.y-u.y); if(d<bd){bd=d;best=c;} }
      if(best){ u.tx=best.x; u.ty=best.y; if(Math.hypot(u.x-best.x,u.y-best.y)<best.r+8){ const raid=(best.owner!==u.team)?1.6:1.0; u.cargo=(20+Math.hypot(best.x-(u.homePort||u.homePost).x,best.y-(u.homePort||u.homePost).y)*0.05)*raid*(u.cargoMul||1); u.laden=true; u.originPort=best; } }
      else { const w=sea?randWater():null; if(w){u.tx=w.x;u.ty=w.y;} }
    } else { // 자기 세력 거점으로 귀환→수익
      const own=nodes.filter(c=>c.owner===u.team); let best=null,bd=1e9; for(const c of own){ const d=Math.hypot(c.x-u.x,c.y-u.y); if(d<bd){bd=d;best=c;} }
      if(best){ u.tx=best.x; u.ty=best.y; if(Math.hypot(u.x-best.x,u.y-best.y)<best.r+8){ gold[u.team]=(gold[u.team]||0)+u.cargo; u.cargo=0; u.laden=false; u.originPort=best; } }
      else { u.laden=false; }
    }
    // 유람선: 인접 개인(비세력)에 ferry 부여
    if(sea){ for(const o of units){ if(o.alive&&isArmy(o)&&!isPower(o.team)&&Math.hypot(o.x-u.x,o.y-u.y)<BOARD){ o.ferryUntil=elapsed+15; } } }
  }
}

function moveUnit(u,dt){ const dx=u.tx-u.x,dy=u.ty-u.y,d=Math.hypot(dx,dy); if(d<=2) return;
  if(u.naval){ // 해상: 물 위만, 목표가 육지면 상륙군은 하선
    let sp=MOVE*(u.shipType==='warship'&&u.crew==='navy'?NAVY_BONUS:(u.shipType==='passenger'?0.6:0.65));
    const step=Math.min(sp*dt,d), nx=u.x+dx/d*step, ny=u.y+dy/d*step;
    if(terrAt(nx,ny)<2){ u.x=nx; u.y=ny; }
    else if(isArmy(u)){ u.naval=false; u.shipType=null; u.crew='land'; u.x=nx; u.y=ny; } // 해안 상륙
    else if(terrAt(nx,u.y)<2){ u.x=nx; } else if(terrAt(u.x,ny)<2){ u.y=ny; }
    u.atSea=u.naval&&terrAt(u.x,u.y)<2;
  } else { // 육상: 물 막힘, 육군은 아군항구/페리로 승선
    const here=terrAt(u.x,u.y), sp=MOVE*(here>=2?TERR[here].spd:0.6);
    const step=Math.min(sp*dt,d), nx=u.x+dx/d*step, ny=u.y+dy/d*step;
    if(terrAt(nx,ny)>=2){ u.x=nx; u.y=ny; }
    else if(isArmy(u)){ const bt=boardType(u); if(bt){ u.naval=true; u.shipType=bt; u.crew='land'; u.x=nx; u.y=ny; u.atSea=true; return; }
      if(terrAt(nx,u.y)>=2) u.x=nx; else if(terrAt(u.x,ny)>=2) u.y=ny; }
    else { if(terrAt(nx,u.y)>=2) u.x=nx; else if(terrAt(u.x,ny)>=2) u.y=ny; } // 기마병참원 등 육상 비전투
    if(terrAt(u.x,u.y)>=2) u.lastLand=landAt(u.x,u.y); u.atSea=false;
  } }

function update(dt){ elapsed+=dt; aiTimer-=dt; upTimer-=dt; navalTimer-=dt;
  if(aiTimer<=0){ aiTimer=0.5; for(const u of units) ai(u); }
  if(upTimer<=0){ upTimer=2.0; aiUpgrade(); }
  if(navalTimer<=0){ const iv=1.0; navalTimer=iv; spawnNaval(iv); }
  for(const team in TS){ gold[team]=(gold[team]||0)+TS[team].farm*GR*dt; } // 농지 수익
  updateTrade(dt);
  for(const u of units){ if(u.alive) moveUnit(u,dt); }
  // 전투 (육↔해 포함, 같은 팀 제외)
  for(let i=0;i<units.length;i++){ const A=units[i]; if(!A.alive)continue;
    for(let j=i+1;j<units.length;j++){ const B=units[j]; if(!B.alive||B.team===A.team)continue;
      if(Math.hypot(A.x-B.x,A.y-B.y)<radiusOf(A)+radiusOf(B)+6){ fight(A,B,dt); fight(B,A,dt); } } }
  // 성 점령 (함선/교역선 제외)
  for(const u of units){ if(!u.alive||isShip(u)||u.kind==='courier') continue; let onC=null;
    for(const c of castles){ if(Math.hypot(c.x-u.x,c.y-u.y)<c.r&&c.owner!==u.team){ let cont=false;
      for(const o of units){ if(o.alive&&o.team!==u.team&&isArmy(o)&&Math.hypot(o.x-c.x,o.y-c.y)<c.r){cont=true;break;} } if(!cont){onC=c;break;} } }
    if(onC){ if(u.capC!==onC){u.capC=onC;u.capProg=0;} u.capProg+=dt; if(u.capProg>=2.2){ onC.owner=u.team; u.capProg=0; u.capC=null;
        if(gold[u.team]===undefined) gold[u.team]=0; TS=computeTS(); if(openC===onC) renderTown(); } }
    else { u.capC=null; u.capProg=0; } }
  // 병력 생산 (궐기=성소유 시에만, 육상 군주만)
  for(const u of units){ if(!u.alive||isShip(u)||u.kind==='courier') continue; const s=TS[u.team];
    if(s){ const cap=capMaxOf(u.team); u.troops=Math.min(cap, u.troops+s.barr*BR*dt); } }
  checkEnd();
}
function fight(att,def,dt){ let dmg=effPower(att)*KILL*dt*(0.85+Math.random()*0.3); if(dmg<=0) return;
  if(!def.naval) dmg*=TERR[terrAt(def.x,def.y)].def;                 // 육상 방어지형
  if(terrAt(att.x,att.y)<2 && !(att.shipType==='warship'&&att.crew==='navy')) dmg*=0.85; // 물 위 비-해군 약화
  def.troops-=dmg; if(def.troops<=0){ def.troops=0; destroy(def,att); } }
function destroy(dead,killer){ dead.alive=false; dead.troops=0; dead.targetU=null;
  if(dead.laden){ gold[killer.team]=(gold[killer.team]||0)+dead.cargo*0.5; dead.laden=false; dead.cargo=0; } // 약탈
  if(selFleet) selFleet=selFleet.filter(s=>s.alive);
  if(isCarrier(dead)) return;                       // 교역선은 항구가 쿨다운 후 재출항(spawnNaval)
  killer.xp+=300; killer.troops+=Math.min(800, 200);
  while(killer.xp>=killer.xpNeed){ killer.xp-=killer.xpNeed; killer.lvl++; killer.xpNeed=Math.round(killer.xpNeed*1.5); killer.atk+=6; } killer.targetU=null; }
function checkEnd(){ if(!playerUnit.alive){ endGame(false,"당신의 군주가 쓰러졌습니다…"); return; }
  let mine=0; for(const c of castles) if(c.owner===playerIdx) mine++;
  if(mine===castles.length){ endGame(true,`${FACTIONS[playerIdx].name}이(가) 대륙을 통일했습니다!`); } }
function endGame(win,msg){ if(ended)return; ended=true; state='end'; closeTown();
  document.getElementById('endScreen').classList.remove('hidden');
  document.getElementById('endTitle').textContent=win?"🏆 승리!":"💀 패배";
  document.getElementById('endMsg').textContent=msg+` (생존 ${elapsed.toFixed(0)}초)`; }

// ============================================================ 렌더
function fmt(n){ n=Math.round(n); if(n>=1e8)return (n/1e8).toFixed(1)+'억'; if(n>=1e4)return (n/1e4).toFixed(1)+'만'; if(n>=1e3)return (n/1e3).toFixed(1)+'천'; return ''+n; }
function tierOf(n){ return n<100?0:n<1e3?1:n<1e4?2:n<1e5?3:n<1e6?4:5; }
function poly(cx,cy,r,n,rot){ ctx.beginPath(); for(let i=0;i<n;i++){ const a=rot+i/n*Math.PI*2,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath(); }
// 함선 그리기: 수송선=둥근화물선 / 전함=길쭉선체+포탑(해군은 금테) / 유람선=돛단상선
function drawShip(u,r,hl){ const x=u.x,y=u.y,col=u.color;
  ctx.lineWidth=hl?3:1.6; ctx.strokeStyle=hl?'#fff':'rgba(0,0,0,0.55)';
  if(u.shipType==='warship'){ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y,r*1.5,r*0.75,0,0,7); ctx.fill(); ctx.stroke();
    if(u.crew==='navy'){ ctx.strokeStyle='#fde047'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(x,y,r*1.5+2,r*0.75+2,0,0,7); ctx.stroke(); }
    ctx.fillStyle='#1f2937'; ctx.fillRect(x-3,y-r*0.5,6,r); }                       // 포탑
  else if(u.shipType==='passenger'){ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y,r*1.3,r*0.8,0,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r*0.9,y-r*0.1); ctx.lineTo(x,y-r*0.1); ctx.closePath(); ctx.fill();  // 돛
    if(u.laden){ ctx.fillStyle='#fde68a'; ctx.beginPath(); ctx.arc(x,y+r*0.5,2.5,0,7); ctx.fill(); } }
  else { ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y,r*1.25,r*0.7,0,0,7); ctx.fill(); ctx.stroke();   // 수송선
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x-r*0.5,y-r*0.35,r,r*0.7); } }
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#05070c'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(cam.zoom,0,0,cam.zoom,-cam.x*cam.zoom,-cam.y*cam.zoom);
  ctx.drawImage(bg,0,0);
  const vx=cam.x, vy=cam.y, vw=cv.width/cam.zoom, vh=cv.height/cam.zoom;
  // 성 (건물 표시)
  for(const c of castles){ if(c.x<vx-40||c.x>vx+vw+40||c.y<vy-40||c.y>vy+vh+40) continue; const col=teamColor(c.owner);
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,7); ctx.fillStyle='rgba(15,20,30,0.85)'; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=col; ctx.stroke();
    ctx.fillStyle=col; ctx.font='17px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🏰',c.x,c.y);
    if(cam.zoom>0.5){ ctx.font='9px sans-serif'; ctx.fillStyle='#cfe'; let tag=''; if(c.port)tag+='⚓'; if(c.shipyard)tag+='🚢';
      ctx.fillText('B'+c.barracks+' F'+c.farm+tag, c.x, c.y+c.r+8); } }
  for(const u of units){ if(u.alive&&u.capC&&u.capProg>0){ const c=u.capC; ctx.beginPath(); ctx.arc(c.x,c.y,c.r+5,-Math.PI/2,-Math.PI/2+(u.capProg/2.2)*Math.PI*2); ctx.lineWidth=4; ctx.strokeStyle=u.color; ctx.stroke(); } }
  if(playerUnit.alive){ const u=playerUnit; if(Math.abs(u.tx-u.x)>3||Math.abs(u.ty-u.y)>3){ ctx.setLineDash([7,7]); ctx.beginPath(); ctx.moveTo(u.x,u.y); ctx.lineTo(u.tx,u.ty); ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]); } }
  // 유닛 (군집 간소화 = 크기 + 위의 명확한 수치)
  const selSet = selFleet?new Set(selFleet):null;
  for(const u of units){ if(!u.alive) continue; if(u.x<vx-40||u.x>vx+vw+40||u.y<vy-40||u.y>vy+vh+40) continue;
    const r=radiusOf(u), me=(u===playerUnit);
    if(isShip(u)){ drawShip(u,r,me||(selSet&&selSet.has(u))); }
    else {
      ctx.lineWidth=me?3:2; ctx.strokeStyle=me?'#fff':'rgba(0,0,0,0.5)'; ctx.fillStyle=u.color;
      if(u.kind==='faction'){ ctx.beginPath(); ctx.arc(u.x,u.y,r,0,7); ctx.fill(); ctx.stroke(); }
      else if(u.kind==='loyal'){ poly(u.x,u.y,r,3,-Math.PI/2); ctx.fill(); ctx.stroke(); }
      else if(u.kind==='courier'){ poly(u.x,u.y,r,3,Math.PI/2); ctx.fill(); ctx.stroke(); if(u.laden){ ctx.fillStyle='#fde68a'; ctx.beginPath(); ctx.arc(u.x,u.y-r-3,2.5,0,7); ctx.fill(); } }
      else { poly(u.x,u.y,r,4,0); ctx.fill(); ctx.stroke(); }
      // 세력 깃발 (궐기 상태만, 군주 유닛)
      if(isArmy(u)&&isPower(u.team)){ ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(u.x,u.y-r); ctx.lineTo(u.x,u.y-r-11); ctx.stroke();
        ctx.fillStyle=teamColor(u.team); ctx.beginPath(); ctx.moveTo(u.x,u.y-r-11); ctx.lineTo(u.x+9,u.y-r-8.5); ctx.lineTo(u.x,u.y-r-6); ctx.closePath(); ctx.fill(); }
    }
    // 명확한 수치 (흰 글자 + 외곽선), 교역선 제외
    if(cam.zoom>0.3 && !isCarrier(u)){ ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.strokeText(fmt(u.troops),u.x,u.y); ctx.fillStyle='#fff'; ctx.fillText(fmt(u.troops),u.x,u.y); }
    if(cam.zoom>0.6){ ctx.fillStyle='#dbeafe'; ctx.font='9px sans-serif'; ctx.fillText(u.name,u.x,u.y+r+9); } }
  // 지역 이름
  ctx.setTransform(1,0,0,1,0,0); ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const rg of regions){ const sx=(rg.x-cam.x)*cam.zoom, sy=(rg.y-cam.y)*cam.zoom; if(sx<0||sx>cv.width||sy<0||sy>cv.height) continue;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillText(rg.name,sx+1,sy+1); ctx.fillStyle='rgba(245,240,225,0.55)'; ctx.fillText(rg.name,sx,sy); }
  drawMinimap();
}
function drawMinimap(){ const r=mmRect(); ctx.drawImage(mm,r.x,r.y,r.w,r.h); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.strokeRect(r.x-1,r.y-1,r.w+2,r.h+2);
  const sx=r.w/WORLD_W, sy=r.h/WORLD_H;
  for(const c of castles){ ctx.fillStyle=teamColor(c.owner); ctx.fillRect(r.x+c.x*sx-1.5,r.y+c.y*sy-1.5,3,3); }
  for(const u of units){ if(!u.alive)continue; ctx.fillStyle=u.color; const s=(u===playerUnit)?2.6:1.6; ctx.fillRect(r.x+u.x*sx-s/2,r.y+u.y*sy-s/2,s,s); }
  const vw=cv.width/cam.zoom, vh=cv.height/cam.zoom; ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.strokeRect(r.x+cam.x*sx, r.y+cam.y*sy, vw*sx, vh*sy); }
function updateHUD(){ const u=playerUnit; const cap=capMaxOf(playerIdx);
  document.getElementById('hpBar').style.width=Math.max(0,Math.min(100,u.troops/cap*100))+'%';
  document.getElementById('xpBar').style.width=(u.xp/u.xpNeed*100)+'%';
  document.getElementById('lvl').textContent=u.lvl;
  document.getElementById('troops').textContent=fmt(u.troops);
  document.getElementById('goldv').textContent=Math.floor(gold[playerIdx]||0);
  let mine=0; for(const c of castles) if(c.owner===playerIdx) mine++;
  document.getElementById('castles').textContent=mine;
  document.getElementById('status').textContent=isPower(playerIdx)?'⚑세력':'·개인';
  document.getElementById('alive').textContent=`세력 ${units.filter(x=>x.alive&&x.kind==='faction').length} · 무소속 ${units.filter(x=>x.alive&&x.kind==='indep').length}`;
  document.getElementById('clock').textContent=elapsed.toFixed(0)+'s';
  const t=TERR[terrAt(u.x,u.y)]; document.getElementById('terr').textContent=`지형: ${t.name} ${t.def<0.95?'🛡엄폐':t.def>1.05?'⚠노출':'·'}${u.atSea?' ⚓항해':''}`;
}
function loop(t){ const dt=Math.min(0.05,(t-lastT)/1000); lastT=t; if(state==='play'){ update(dt); updateHUD(); } draw(); if(state!=='end') requestAnimationFrame(loop); }
const list=document.getElementById('factionList');
FACTIONS.forEach((f,i)=>{ const b=document.createElement('button'); b.className='fbtn'; b.style.background=f.color; b.style.color=['#f5d442','#84cc16','#38bdf8','#94a3b8'].includes(f.color)?'#10151f':'#fff'; b.innerHTML=f.name+'<small>영웅: '+f.hero+'</small>'; b.onclick=()=>startGame(i); list.appendChild(b); });
resize();
</script>
</body>
