<style>

  #over h2{font-size:30px;margin-bottom:8px}#over button{margin-top:14px;padding:11px 26px;border:none;border-radius:11px;background:#2563eb;color:#fff;font-size:15px;font-weight:800}
</style>

<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <span class="pill" id="hFac">—</span><span class="pill" id="hTroops">⚔0</span>

</div>
<div id="hint" class="hidden">탭=이동/선택 · 내 성 탭=운영 · 내 성 꾹+드래그=양성 · 끌기=지도 · 두손가락=확대</div>

<div id="start"><div class="wrap">
  <h1>⚔️ 예슈아 월드맵 전쟁</h1>
  <p>7세력 · 충성 7 · 무소속 7, 총 21 군주가 대륙을 다툰다.<br>성을 가진 자만 병력을 만들고, 모두 잃으면 떠도는 개인이 된다.<br>개인이 첫 성을 점령해 궐기하면 <b>예슈아한민족진리단일국가</b>로 거듭난다.</p>
  <p style="color:#cfe;margin-top:8px">플레이할 세력을 고르세요</p>
  <div id="fl"></div>
</div></div>
<div id="over" class="hidden"><h2 id="overT">⚑</h2><div id="overD" style="color:#9fb2c8"></div><button onclick="location.reload()">다시 하기</button></div>
<script>
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; }
addEventListener('resize',resize); resize();
const VW=()=>cv.width/DPR, VH=()=>cv.height/DPR;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ===== 데이터 =====
const WW=1200, WH=1800;
const FACTIONS=[
  {name:"예슈아한민족국",hero:"예슈아",color:"#f5d442",crest:true,desc:"참 선지자 예슈아의 백성"},
  {name:"밤마루 겨레",hero:"검불",color:"#a855f7",desc:"밤 골짜기를 내달리는 겨레"},
  {name:"노을 누리",hero:"한별",color:"#f97316",desc:"붉은 노을의 떠돌이 겨레"},
  {name:"눈벌 한",hero:"흰메",color:"#38bdf8",desc:"얼어붙은 북녘의 무리"},
  {name:"푸른들 두레",hero:"벌하",color:"#84cc16",desc:"드넓은 풀벌의 두레"},
  {name:"큰물 무리",hero:"미르",color:"#3b82f6",desc:"바다·큰 강의 물길 무리"},
  {name:"무쇠 골",hero:"검쇠",color:"#94a3b8",desc:"무쇠를 벼리는 골 사람들"},
  {name:"예슈아한민족진리단일국가",hero:"예슈아하마쉬앟아버지랍비멜렉우앟엘로힘",color:"#14b8a6",crest:true,desc:"궐기한 개인이 거듭나는 진리의 단일 국가"},
  {name:"거짓 교단",hero:"거짓선지자",color:"#be123c",hostile:true,desc:"타락한 악마를 섬기는 거짓 선지자"},
];
const NF=FACTIONS.length, PLAY=7, RISE=7, EVIL=8;         // 0~6 플레이, 7=궐기 전용, 8=적대(거짓 교단)
const LOYAL=["한벼리","밤쇠","노올","눈메","푸르미","가람","쇠돌","참빛"];
const INDEP=["떠돌이 한새","활잡이 나래","들바람 노루","그늘 살손","외돌이 검돌","달안개 다래","비바리 솔뫼"];
const INDEPC=["#e879f9","#fb7185","#22d3ee","#facc15","#4ade80","#fb923c","#c084fc"];
// 병종 0~7 공통 / 8~14 세력특수(8+f) / 15 궐기특수 / 16 거짓사제
const TNAME=['보병','기병','궁병','소총병','기갑','포병','자주포병','예슈아대','예슈아한민족대','밤기마','노을활잡이','눈보라꾼','들풀지기','물너울대','무쇠벼리','예슈아행하기위해죽지않음지옥','거짓사제'];
const TICON=['🗡','🐎','🏹','🔫','🛡','💥','🚀','✦','⭐','🌑','🌅','❄️','🌿','🌊','⚙️','☀️','✝'];
const EQUIP=[0,35,25,45,100,70,90,40,80,80,80,80,80,80,80,80,80];
const TCOL=['#e5e7eb','#f9a8d4','#86efac','#fca5a5','#93c5fd','#fbbf24','#fb923c','#fde68a','#fff7cc','#c4b5fd','#fdba74','#bae6fd','#bbf7d0','#7dd3fc','#cbd5e1','#5eead4','#fb7185'];
// 전투 상수
const ATK_EXP=Math.log10(4.2), TAC_ATK=1.42, TAC_DEF=0.23, RATE=0.5, ENC=0.2;
const RANGED=78, NAVY=1.42, SHIPBASE=1700, BOARD=92, HEALR=74, HEALRATE=46;
const TBEAT={4:3,3:1,1:4};
const counters=(a,b)=>TBEAT[a]===b;
const atkB=t=>Math.pow(Math.max(1,t)/42,ATK_EXP);
const isRanged=t=>t===2||t===5||t===6, isHealer=t=>t===7, isSiege=t=>t===5||t===6;
const rangeOf=t=>t===2?RANGED:t===5?160:t===6?128:0;
function tacAtk(a,d){ if(a==null||d==null)return 1;
  if(a===1)return d!==4?TAC_ATK:1;
  if(a===3)return d===4?1:(d===1?TAC_ATK*TAC_ATK:TAC_ATK);
  if(a===5||a===6)return d===4?TAC_ATK:1;
  if(a>=8)return 1.21; return counters(a,d)?TAC_ATK:1; }
function tacDef(d,a){ if(a==null||d==null)return 1;
  if(d===3)return a===4?1:1/TAC_ATK;
  if(d===4)return (a===5||a===6)?TAC_ATK:0.7;
  if(d>=8)return 0.85; if(counters(d,a))return TAC_DEF; return 1; }

// ===== 노이즈/월드 =====
function hash(x,y){ let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0; h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967295; }
function vnoise(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ let s=0,a=.5,f=1; for(let i=0;i<5;i++){ s+=a*vnoise(x*f,y*f); f*=2; a*=.5; } return s/0.96875; }
const LW=600,LH=900,LS=WW/LW,SEA=0.42;
const land=document.createElement('canvas'); land.width=LW; land.height=LH;
let elevAt, moistAt;
function biome(e,m){ if(e<SEA){ const t=Math.max(0,e/SEA); return [18+t*40,46+t*70,82+t*60]; }
  if(e<SEA+0.018)return [214,200,150];
  const le=(e-SEA)/(1-SEA);
  if(le>0.82)return [236,240,245]; if(le>0.62){const k=(le-0.62)/0.2;return [120-k*30,116-k*28,112-k*26];}
  if(le>0.44)return m<0.45?[150,140,96]:[96,120,70];
  if(m<0.30)return [205,186,120]; if(m<0.45)return [183,176,104]; if(m<0.66)return [126,162,88]; return [60,116,66]; }
// 지형코드(존/이동/엄폐용): 0바다 1해안 2사막 3평지 4초원 5진흙 6산 7설산
function terrCode(e,m){ if(e<SEA)return 0; if(e<SEA+0.02)return 1; const le=(e-SEA)/(1-SEA);
  if(le>0.82)return 7; if(le>0.62)return 6; if(le>0.44)return 5; if(m<0.30)return 2; if(m<0.62)return 3; return 4; }
const TERRSPD=[0.4,0.7,0.85,1.15,1.0,0.6,0.55,0.7], TERRDEF=[1.3,1.1,1.0,1.12,0.9,0.95,0.66,0.74], TERRNAME=['바다','해안','사막','평지','초원/숲','진흙','산맥','설산'];
function genWorld(){ const sc=120,ox=hash(7,3)*1000,oy=hash(11,5)*1000,mx=hash(2,9)*1000,my=hash(4,1)*1000;
  const E=new Float32Array(LW*LH),M=new Float32Array(LW*LH);
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){ const i=y*LW+x; let e=fbm(x/sc+ox,y/sc+oy);
    const dx=Math.abs(x/LW*2-1),dy=Math.abs(y/LH*2-1); e-=Math.pow(Math.max(dx,dy),2.4)*0.42; E[i]=e; M[i]=fbm(x/90+mx,y/90+my); }
  elevAt=(wx,wy)=>{const x=clamp(wx/LS|0,0,LW-1),y=clamp(wy/LS|0,0,LH-1);return E[y*LW+x];};
  moistAt=(wx,wy)=>{const x=clamp(wx/LS|0,0,LW-1),y=clamp(wy/LS|0,0,LH-1);return M[y*LW+x];};
  const img=ctx.createImageData(LW,LH),d=img.data,Lx=-0.55,Ly=-0.62,Lz=0.56;
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){ const i=y*LW+x,e=E[i],c=biome(e,M[i]); let r=c[0],g=c[1],b=c[2];
    if(e>=SEA){ const ex=E[i+(x<LW-1?1:0)],ey=E[i+(y<LH-1?LW:0)]; let nx=(e-ex)*11,ny=(e-ey)*11,nl=Math.sqrt(nx*nx+ny*ny+1);
      let sh=(nx*Lx+ny*Ly+Lz)/nl; sh=0.5+0.8*clamp(sh+0.15,0,1); r*=sh;g*=sh;b*=sh; const le=(e-SEA)/(1-SEA);
      if(le<0.02){r=r*.5+100;g=g*.5+95;b=b*.5+75;} if(le>0.6){const sp=Math.max(0,(sh-1.05)*1.6);r+=sp*70;g+=sp*70;b+=sp*72;} }
    else { const w=Math.sin((x*0.9+y)*0.22+vnoise(x/22,y/22)*6)*4; r+=w;g+=w;b+=w; if(e>SEA-0.018){const s=(e-(SEA-0.018))/0.018;r+=s*55;g+=s*60;b+=s*45;} }
    const p=i*4; d[p]=r;d[p+1]=g;d[p+2]=b;d[p+3]=255; }
  land.getContext('2d').putImageData(img,0,0); }

// ===== 정착지/영역 =====
const GC=20,GX=Math.ceil(WW/GC),GY=Math.ceil(WH/GC);
let castles=[],owner=new Int16Array(GX*GY),owId=new Int16Array(GX*GY),borderPath=null;
const tintC=document.createElement('canvas'); tintC.width=GX; tintC.height=GY;
const TIER=[{n:"촌락",r:13},{n:"마을",r:16},{n:"중규모 마을",r:19},{n:"대규모 마을",r:22},{n:"도시",r:26},{n:"중규모 도시",r:30},{n:"대규모 도시",r:34}];
function isCoastal(x,y){ for(let a=0;a<8;a++){ const ang=a/8*6.283; if(elevAt(x+Math.cos(ang)*34,y+Math.sin(ang)*34)<SEA)return true; } return false; }
function placeCastles(){ castles=[]; let tries=0;
  while(castles.length<44&&tries<5000){ tries++; const x=40+Math.random()*(WW-80),y=40+Math.random()*(WH-80);
    const e=elevAt(x,y); if(e<SEA+0.03||e>SEA+0.5)continue; let ok=true; for(const c of castles)if(Math.hypot(c.x-x,c.y-y)<92){ok=false;break;}
    if(!ok)continue; const rr=Math.random(),t=rr<.28?0:rr<.5?1:rr<.68?2:rr<.82?3:rr<.92?4:rr<.975?5:6;
    castles.push({x,y,t,r:TIER[t].r,owner:-1,fort:t>=4?t-3:0,capC:null,capProg:0,barr:1+(t/2|0),farm:1+(t/2|0),reserve:0,aiAcc:0,
      port:false,shipyard:false,tradePost:false,coastal:isCoastal(x,y),embark:'transport',pmax:1,pCD:0,cCD:0,escort:0,capital:false}); } }
function tcolor(t){ return t<0?'#9aa':t<NF?FACTIONS[t].color:(t>=100?INDEPC[t-100]:'#fb7185'); }
let regions=[]; const RNAMES=['한벌','검산골','노을 들','눈마루','푸른벌','큰물가','무쇠재','달여울','솔메','아라 갯벌','벼리골','한울 고원'];
function buildRegions(){ regions=[]; let tries=0; while(regions.length<10&&tries<2000){tries++;const p=randLand();let ok=true;for(const r of regions)if(Math.hypot(r.x-p.x,r.y-p.y)<250){ok=false;break;}if(ok)regions.push({x:p.x,y:p.y,name:RNAMES[regions.length%RNAMES.length]});} }
function paintTint(){ const g=tintC.getContext('2d'); g.clearRect(0,0,GX,GY);
  for(let i=0;i<owner.length;i++){ const t=owner[i]; if(t<0)continue; g.fillStyle=tcolor(t); g.fillRect(i%GX,i/GX|0,1,1); } }
function buildTerritory(){ for(let gy=0;gy<GY;gy++)for(let gx=0;gx<GX;gx++){ const i=gy*GX+gx,wx=gx*GC+GC/2,wy=gy*GC+GC/2;
    if(elevAt(wx,wy)<SEA){owner[i]=-2;owId[i]=-1;continue;} let bi=-1,bd=1e9;
    for(let k=0;k<castles.length;k++){const d=(castles[k].x-wx)**2+(castles[k].y-wy)**2;if(d<bd){bd=d;bi=k;}} owId[i]=bi; owner[i]=bi>=0?castles[bi].owner:-1; }
  paintTint(); buildBorder(); }
function refreshTerr(){ for(let i=0;i<owId.length;i++){const o=owId[i];owner[i]=o>=0?castles[o].owner:(owner[i]===-2?-2:-1);} paintTint(); buildBorder(); }
function chaikin(p,it){ for(let k=0;k<it;k++){ if(p.length<3)break; const o=[p[0]]; for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);} o.push(p[p.length-1]); p=o; } return p; }
function buildBorder(){ const ow=i=>{const o=owId[i];return o<0?-1:castles[o].owner;}; const edges=[];
  for(let gy=0;gy<GY;gy++)for(let gx=0;gx<GX;gx++){ const i=gy*GX+gx,a=ow(i); if(a<0)continue;
    if(gx+1<GX){const b=ow(i+1);if(b>=0&&b!==a)edges.push([gx+1,gy,gx+1,gy+1]);} if(gy+1<GY){const b=ow(i+GX);if(b>=0&&b!==a)edges.push([gx,gy+1,gx+1,gy+1]);} }
  const K=(x,y)=>x+','+y,P=s=>s.split(',').map(Number),EK=(a,b)=>a<b?a+'~'+b:b+'~'+a,adj=new Map(),lk=(a,b)=>{(adj.get(a)||adj.set(a,[]).get(a)).push(b);};
  for(const[ax,ay,bx,by]of edges){const a=K(ax,ay),b=K(bx,by);lk(a,b);lk(b,a);}
  const used=new Set(),lines=[],walk=(c,pv,ln,un)=>{while(1){const ns=adj.get(c)||[];let nx=null;for(const z of ns){if(z===pv)continue;if(!used.has(EK(c,z))){nx=z;break;}}if(!nx)break;used.add(EK(c,nx));un?ln.unshift(P(nx)):ln.push(P(nx));pv=c;c=nx;}};
  for(const[ax,ay,bx,by]of edges){const a=K(ax,ay),b=K(bx,by);if(used.has(EK(a,b)))continue;used.add(EK(a,b));const ln=[P(a),P(b)];walk(b,a,ln,0);walk(a,b,ln,1);lines.push(ln);}
  const pa=typeof Path2D!=='undefined'?new Path2D():null;
  if(pa)for(let ln of lines){ln=chaikin(ln.map(([x,y])=>[x*GC,y*GC]),2);pa.moveTo(ln[0][0],ln[0][1]);for(let k=1;k<ln.length;k++)pa.lineTo(ln[k][0],ln[k][1]);}
  borderPath=pa; }

// ===== 유닛/경제 상태 =====
let units=[],playerIdx=0,lord=null,state='menu',gold=[],coinPool=[],sel=null;
function isShip(u){return u.naval;}
function isCarrier(u){return u.shipType==='passenger'||u.kind==='courier';}
function isArmy(u){return u.kind==='faction'||u.kind==='loyal'||u.kind==='indep';}
function isPower(t){ for(const c of castles)if(c.owner===t)return true; return false; }
function capMax(t){ let b=0;for(const c of castles)if(c.owner===t)b+=c.barr; return isPower(t)?2000+b*4000:1500; }
function power(u){ if(u.shipType==='warship')return u.crew==='navy'?atkB(u.troops)*NAVY:atkB(SHIPBASE);
  if(u.shipType==='transport')return atkB(SHIPBASE)*0.35; if(isCarrier(u))return 0;
  const t=u.ttype,m=t===7?0.05:t===2?0.6:(t===5||t===6)?0.45:t===4?1.25:t===3?1.1:t>=8?1.15:1; return atkB(u.troops)*m*(u.gearAtk||1); }
function radius(u){ if(isShip(u)||u.kind==='courier')return 9; return 7+Math.min(20,Math.log10(u.troops+10)*4.4); }
function mk(o){ return Object.assign({x:0,y:0,tx:0,ty:0,troops:420,team:0,ttype:0,kind:'army',alive:true,target:null,capC:null,capProg:0,
  naval:false,shipType:null,crew:null,coin:0,gearAtk:1,gearDef:1,gearSpd:1,gearRegen:0,homePort:null,homePost:null,cargo:0,laden:false,ferry:0,manual:null},o); }
function fmt(n){ n=Math.round(n); return n>=10000?(n/10000).toFixed(n>=100000?0:1)+'만':n>=1000?(n/1000).toFixed(1)+'천':''+n; }

// ===== 시작 =====
function startGame(idx){ playerIdx=idx; state='play'; units=[]; gold=new Array(NF).fill(120); coinPool=new Array(NF).fill(0);
  const home=[0]; while(home.length<PLAY){ let bi=0,bd=-1; for(let i=0;i<castles.length;i++){if(home.includes(i))continue;let md=1e9;for(const h of home)md=Math.min(md,(castles[i].x-castles[h].x)**2+(castles[i].y-castles[h].y)**2);if(md>bd){bd=md;bi=i;}} home.push(bi); }
  home.forEach((ci,f)=>{ const c=castles[ci]; c.owner=f; c.t=Math.max(c.t,4); c.r=TIER[c.t].r; c.fort=Math.max(c.fort,1); c.barr=Math.max(3,c.barr); c.capital=true;
    units.push(mk({kind:'faction',team:f,ttype:8+f,x:c.x,y:c.y,tx:c.x,ty:c.y,troops:4200,hero:FACTIONS[f].hero}));
    units.push(mk({kind:'loyal',team:f,ttype:(f+2)%5,x:c.x+34,y:c.y+28,tx:c.x+34,ty:c.y+28,troops:900,hero:LOYAL[f]})); });
  for(let i=0;i<7;i++){ let p=randLand(); units.push(mk({kind:'indep',team:100+i,ttype:i%5,x:p.x,y:p.y,tx:p.x,ty:p.y,troops:420,hero:INDEP[i]})); }
  // 적대세력 거짓 교단(플레이 불가, 모든 세력과 적대) — 플레이어에게서 가장 먼 중립 성에 거점
  { let ci=-1,bd=-1; for(let i=0;i<castles.length;i++){ if(castles[i].owner>=0)continue; let md=1e9; for(const u of units)if(u.kind==='faction')md=Math.min(md,(castles[i].x-u.x)**2+(castles[i].y-u.y)**2); if(md>bd){bd=md;ci=i;} }
    if(ci>=0){ const c=castles[ci]; c.owner=EVIL; c.t=Math.max(c.t,5); c.r=TIER[c.t].r; c.fort=Math.max(c.fort,4); c.barr=Math.max(4,c.barr); c.capital=true;
      units.push(mk({kind:'faction',team:EVIL,ttype:16,x:c.x,y:c.y,tx:c.x,ty:c.y,troops:6000,hero:FACTIONS[EVIL].hero}));
      units.push(mk({kind:'faction',team:EVIL,ttype:16,x:c.x+30,y:c.y+24,tx:c.x+30,ty:c.y+24,troops:2800}));
      let nx=-1,nd=1e9; for(let i=0;i<castles.length;i++){if(castles[i].owner>=0)continue;const d=(castles[i].x-c.x)**2+(castles[i].y-c.y)**2;if(d<nd){nd=d;nx=i;}}
      if(nx>=0){castles[nx].owner=EVIL;castles[nx].fort=Math.max(castles[nx].fort,2);} } }
  lord=units.find(u=>u.team===idx&&u.kind==='faction'); lord.kind='lord';
  buildTerritory();
  document.getElementById('start').classList.add('hidden'); document.getElementById('hud').classList.remove('hidden'); document.getElementById('hint').classList.remove('hidden');
  cam.zoom=clamp(VW()/640,camMin(),2.4); cam.x=lord.x-VW()/cam.zoom/2; cam.y=lord.y-VH()/cam.zoom/2; clampCam(); }
function randLand(){ for(let i=0;i<200;i++){const x=Math.random()*WW,y=Math.random()*WH;if(elevAt(x,y)>=SEA+0.02)return{x,y};} return{x:WW/2,y:WH/2}; }

// ===== 카메라 =====
const cam={x:0,y:0,zoom:1};
const camMin=()=>Math.max(VW()/WW,VH()/WH);
function clampCam(){ cam.zoom=clamp(cam.zoom,camMin(),3.4); cam.x=clamp(cam.x,0,WW-VW()/cam.zoom); cam.y=clamp(cam.y,0,WH-VH()/cam.zoom); }
const s2w=(sx,sy)=>({x:cam.x+sx/cam.zoom,y:cam.y+sy/cam.zoom});
const w2s=(wx,wy)=>({x:(wx-cam.x)*cam.zoom,y:(wy-cam.y)*cam.zoom});

// ===== 이동 =====
const MOVE=58;
function moveUnit(u,dt){ const dx=u.tx-u.x,dy=u.ty-u.y,d=Math.hypot(dx,dy); if(d<=1.5)return;
  let sp=MOVE*(u.gearSpd||1); if(u.shipType==='warship'&&u.crew==='navy')sp*=NAVY; else if(u.naval)sp*=0.7;
  else { const tc=terrCode(elevAt(u.x,u.y),moistAt(u.x,u.y)); sp*=(u.ttype===1?1.3:u.ttype===4?0.8:1)*(tc>=2?TERRSPD[tc]:0.5); }
  const nx=u.x+dx/d*Math.min(sp*dt,d), ny=u.y+dy/d*Math.min(sp*dt,d);
  const water=elevAt(nx,ny)<SEA;
  if(u.naval){ if(water||true){ u.x=nx;u.y=ny; if(!water&&isCarrier(u)){} } }
  else { if(!water){ u.x=nx;u.y=ny; u.atSea=false; } else { // 도하: 항구 승선 or ferry
      if(canCross(u)){ u.x=nx;u.y=ny; u.atSea=true; } else { u.tx=u.x;u.ty=u.y; } } } }
function canCross(u){ if(u.ferry>now)return true; for(const c of castles)if(c.port&&c.owner===u.team&&Math.hypot(c.x-u.x,c.y-u.y)<BOARD)return true; return false; }

// ===== 전투/회복 =====
let now=0;
function fight(a,d,dt){ const ap=power(a); if(ap<=0)return; let raw=ap-power(d)*0.5; if(raw<0.05)raw=0.05;
  raw*=tacAtk(a.ttype,d.ttype)*tacDef(d.ttype,a.ttype); raw*=1+ENC*Math.min(3,Math.max(0,(d._eng||1)-1));
  const tc=terrCode(elevAt(d.x,d.y),moistAt(d.x,d.y)); raw*=TERRDEF[tc]||1; raw*=(d.gearDef||1);
  d.troops-=raw*42*RATE*dt; d._hit=now; if(d.troops<=0){d.troops=0;destroy(d,a);} }
function rangedHit(a,d,dt){ let raw=atkB(a.troops)*(isSiege(a.ttype)?1.1:0.7); const tc=terrCode(elevAt(d.x,d.y),moistAt(d.x,d.y)); raw*=TERRDEF[tc]||1;
  if(d.ttype===4)raw*=isSiege(a.ttype)?TAC_ATK:0.5; raw*=(d.gearDef||1); d.troops-=raw*42*RATE*dt; if(d.troops<=0){d.troops=0;destroy(d,a);} }
function destroy(dead,killer){ dead.alive=false; dead.troops=0;
  if(dead.laden&&killer){gold[killer.team]=(gold[killer.team]||0)+dead.cargo*0.5;} if(killer)killer.coin=(killer.coin||0)+Math.min(80,dead.troops*0.02);
  if(dead===lord){ endGame(false); } }

// ===== 업데이트 =====
let aiT=0,terrT=0,navalT=0,upT=0;
function aiUpgrade(){ for(let t=0;t<NF;t++){ if(t===playerIdx||t===RISE||!isPower(t))continue; let g=gold[t]||0; const towns=castles.filter(c=>c.owner===t); if(!towns.length)continue;
  for(const c of towns){ if(g>=COST.farm(c.farm)&&c.farm<=c.barr){g-=COST.farm(c.farm);c.farm++;} else if(g>=COST.barr(c.barr)){g-=COST.barr(c.barr);c.barr++;} }
  const coast=towns.find(c=>c.coastal&&!c.port); if(coast&&g>=COST.port&&Math.random()<.5){g-=COST.port;coast.port=true;}
  const ps=towns.find(c=>c.port&&!c.shipyard); if(ps&&g>=COST.shipyard&&Math.random()<.4){g-=COST.shipyard;ps.shipyard=true;}
  const np=towns.find(c=>!c.tradePost); if(np&&g>=COST.post&&Math.random()<.4){g-=COST.post;np.tradePost=true;}
  const lf=towns.find(c=>c.fort<7); if(lf&&g>=COST.fort(lf.fort+1)&&Math.random()<.3){g-=COST.fort(lf.fort+1);lf.fort++;}
  gold[t]=g; } }
function update(dt){ now+=dt; aiT-=dt; navalT-=dt; upT-=dt; if(upT<=0){upT=3;aiUpgrade();}
  for(const u of units){ if(u.alive)moveUnit(u,dt); }
  if(aiT<=0){ aiT=0.5; for(const u of units)if(u.alive)ai(u); }
  for(const u of units)u._eng=0;
  const pairs=[];
  for(let i=0;i<units.length;i++){const A=units[i];if(!A.alive)continue;
    for(let j=i+1;j<units.length;j++){const B=units[j];if(!B.alive||B.team===A.team)continue;
      if(Math.hypot(A.x-B.x,A.y-B.y)<radius(A)+radius(B)+5){A._eng++;B._eng++;pairs.push([A,B]);} } }
  for(const[A,B]of pairs){ if(A.alive&&B.alive){ if(!isCarrier(A))fight(A,B,dt); if(A.alive&&B.alive&&!isCarrier(B))fight(B,A,dt); } }
  for(const A of units){ if(!A.alive||!isRanged(A.ttype)||A.naval)continue; const R=rangeOf(A.ttype);
    for(const B of units){if(!B.alive||B.team===A.team||isCarrier(B))continue;if(Math.hypot(A.x-B.x,A.y-B.y)<R)rangedHit(A,B,dt);} }
  for(const H of units){ if(!H.alive||H.ttype!==7||isShip(H))continue; const cap=capMax(H.team);
    for(const u of units){if(!u.alive||u.team!==H.team||u===H||isShip(u)||isCarrier(u))continue;if(Math.hypot(H.x-u.x,H.y-u.y)<HEALR)u.troops=Math.min(cap,u.troops+HEALRATE*dt);} }
  // 점령
  for(const u of units){ if(!u.alive||isShip(u)||u.kind==='courier'||!isArmy(u))continue; let on=null;
    for(const c of castles){ if(c.owner!==u.team&&Math.hypot(c.x-u.x,c.y-u.y)<c.r){ let blk=false;
      for(const o of units)if(o.alive&&o.team!==u.team&&isArmy(o)&&Math.hypot(o.x-c.x,o.y-c.y)<c.r){blk=true;break;} if(!blk){on=c;break;} } }
    if(on){ if(u.capC!==on){u.capC=on;u.capProg=0;} u.capProg+=dt; if(u.capProg>=2.2+on.fort*1.1){ const was=isPower(u.team); if(!was)riseIntoTruth(u); on.owner=u.team; if(!was)on.capital=true; u.capProg=0;u.capC=null; terrT=0.01; } }
    else u.capC=null; }
  // 경제: 농지 수익 + 인력 + AI 양성 + 예슈아화 발행
  for(let f=0;f<NF;f++){ let farm=0; for(const c of castles)if(c.owner===f)farm+=c.farm; gold[f]=(gold[f]||0)+farm*2.2*dt; }
  for(const c of castles){ if(c.owner<0)continue; c.reserve=Math.min(2000+c.barr*1500,c.reserve+c.barr*9*dt);
    if(c.owner!==playerIdx){ c.aiAcc+=c.barr*0.18*dt; while(c.aiAcc>=1&&c.reserve>=420){ c.aiAcc-=1; const ty=aiPick(c.owner); c.reserve-=420; gold[c.owner]-=EQUIP[ty]; deposit(c.owner,ty,c,420); } } }
  if(train.on)processTrain(dt);
  updateTrade(dt); spawnNaval(dt); shopTick(dt);
  if(playerIdx>=0&&lord&&lord.alive){ lord.coin=(lord.coin||0)+(3+ownedCount(playerIdx))*dt; if(lord.gearRegen)lord.troops=Math.min(capMax(playerIdx),lord.troops+lord.gearRegen*dt); }
  units=units.filter(u=>u.alive);
  if(terrT>0){terrT-=dt;if(terrT<=0)refreshTerr();}
  // 승패
  if(!lord||!lord.alive){ return; }
  const own=ownedCount(playerIdx); const totalC=castles.length;
  let mine=0;for(const c of castles)if(c.owner===playerIdx)mine++; if(mine===totalC){ endGame(true); } }
function ownedCount(t){ let n=0;for(const c of castles)if(c.owner===t)n++; return n; }
function riseIntoTruth(u){ const T=RISE; if(u.team===T)return; if(u===lord)playerIdx=T; u.team=T; if(u.ttype<8)u.ttype=8+0; if(gold[T]===undefined)gold[T]=120; if(coinPool[T]===undefined)coinPool[T]=0; }
function deposit(team,type,c,amt){ const cap=capMax(team); let best=null,bd=1e18,cnt=0;
  for(const u of units){if(!u.alive||isShip(u)||u.kind==='courier'||u.team!==team)continue;cnt++;if(u.ttype===type){const d=Math.hypot(u.x-c.x,u.y-c.y);if(d<bd){bd=d;best=u;}}}
  if(best){best.troops=Math.min(cap,best.troops+amt);return;}
  if(cnt<9)units.push(mk({kind:team<PLAY?'loyal':team===RISE?'loyal':'indep',team,ttype:type,x:c.x+(Math.random()*20-10),y:c.y+(Math.random()*20-10),tx:c.x,ty:c.y,troops:amt,hero:TNAME[type]+'대'})); }

// ===== AI =====
function effP(u){return power(u);}
function aiPick(team){ const g=gold[team]||0,cand=[[0,3]]; if(g>=EQUIP[1])cand.push([1,2]);if(g>=EQUIP[2])cand.push([2,2]);if(g>=EQUIP[3])cand.push([3,2]);if(g>=EQUIP[4])cand.push([4,1.4]);if(g>=EQUIP[5])cand.push([5,1]);if(g>=EQUIP[6])cand.push([6,1]);if(g>=EQUIP[7])cand.push([7,.8]); if(team>=0&&team<NF&&team!==RISE&&g>=EQUIP[8+team])cand.push([8+team,1.6]); let s=0;for(const c of cand)s+=c[1];let r=Math.random()*s;for(const c of cand){r-=c[1];if(r<=0)return c[0];}return 0; }
function nearestOwn(u){let b=null,bd=1e18;for(const c of castles){if(c.owner!==u.team)continue;const d=(c.x-u.x)**2+(c.y-u.y)**2;if(d<bd){bd=d;b=c;}}return b;}
let landId=new Int16Array(GX*GY);
function computeLand(){ landId.fill(-1); let id=0; const st=[]; for(let i=0;i<GX*GY;i++){ if(landId[i]>=0)continue; const gx=i%GX,gy=i/GX|0; if(elevAt(gx*GC+GC/2,gy*GC+GC/2)<SEA)continue; landId[i]=id; st.length=0; st.push(i);
  while(st.length){const j=st.pop(),x=j%GX,y=j/GX|0; for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=GX||ny>=GY)continue;const k=ny*GX+nx;if(landId[k]>=0)continue;if(elevAt(nx*GC+GC/2,ny*GC+GC/2)<SEA)continue;landId[k]=id;st.push(k);}} id++; } }
function landAt(x,y){const gx=clamp(x/GC|0,0,GX-1),gy=clamp(y/GC|0,0,GY-1);return landId[gy*GX+gx];}
function teamHasPort(t){for(const c of castles)if(c.owner===t&&c.port)return true;return false;}
function reachable(u,x,y){ return u.ferry>now||teamHasPort(u.team)||landAt(u.x,u.y)===landAt(x,y); }
function ai(u){ if(u===lord)return; if(isCarrier(u))return; if(u.shipType==='warship'){aiWar(u);return;} if(!isArmy(u)){return;}
  const my=effP(u); let threat=0; for(const o of units){if(!o.alive||o.team===u.team||isCarrier(o))continue;if(Math.hypot(o.x-u.x,o.y-u.y)<150)threat+=effP(o);}
  if(threat>my*1.6){const r=nearestOwn(u);if(r){u.target=null;u.tx=r.x;u.ty=r.y;return;}}
  // 위협받는 아군 성 방어
  let df=null,dd=400*400; for(const c of castles){if(c.owner!==u.team)continue;let en=false;for(const o of units)if(o.alive&&o.team!==u.team&&isArmy(o)&&Math.hypot(o.x-c.x,o.y-c.y)<c.r+70){en=true;break;}if(!en)continue;const d=(c.x-u.x)**2+(c.y-u.y)**2;if(d<dd){dd=d;df=c;}}
  if(df){u.tx=df.x;u.ty=df.y;return;}
  let we=null,wd=340;for(const o of units){if(!o.alive||o.team===u.team||isCarrier(o))continue;if(!reachable(u,o.x,o.y))continue;const d=Math.hypot(o.x-u.x,o.y-u.y);if(d<wd&&effP(o)<my*1.05){wd=d;we=o;}}
  if(we&&wd<220){u.target=we;u.tx=we.x;u.ty=we.y;return;}
  let tc=null,best=1e18;for(const c of castles){if(c.owner===u.team||!reachable(u,c.x,c.y))continue;let sc=Math.hypot(c.x-u.x,c.y-u.y);if(c.owner<0)sc-=120;if(sc<best){best=sc;tc=c;}}
  if(tc){u.tx=tc.x;u.ty=tc.y;return;} const h=nearestOwn(u); if(h){u.tx=h.x;u.ty=h.y;} }
function aiWar(u){ let t=null,td=520;for(const o of units){if(!o.alive||o.team===u.team)continue;if(!isShip(o))continue;const d=Math.hypot(o.x-u.x,o.y-u.y);if(d<td){td=d;t=o;}} if(t){u.tx=t.x;u.ty=t.y;return;}
  if(u.homePort){const w=nearWater(u.homePort.x,u.homePort.y);if(w){u._wt=(u._wt||0)-0.5;if(u._wt<=0||Math.hypot(u.x-u.tx,u.y-u.ty)<14){u._wt=3;const a=Math.random()*7;u.tx=w.x+Math.cos(a)*70;u.ty=w.y+Math.sin(a)*70;}}} }
function nearWater(x,y){ for(let r=20;r<300;r+=20)for(let a=0;a<8;a++){const ang=a/8*6.283,nx=x+Math.cos(ang)*r,ny=y+Math.sin(ang)*r;if(nx>0&&nx<WW&&ny>0&&ny<WH&&elevAt(nx,ny)<SEA)return{x:nx,y:ny};} return null; }

// ===== 무역/함선 =====
let warCD={};
function spawnNaval(dt){ for(const c of castles){ if(c.owner<0)continue;
  if(c.port){ c.pCD-=dt; const have=units.filter(u=>u.alive&&u.shipType==='passenger'&&u.homePort===c).length; if(have<(c.pmax||1)&&c.pCD<=0){const w=nearWater(c.x,c.y);if(w){units.push(mk({kind:'passenger',shipType:'passenger',naval:true,team:c.owner,x:w.x,y:w.y,tx:w.x,ty:w.y,troops:320,homePort:c,ttype:null}));c.pCD=10;}} }
  if(c.tradePost){ c.cCD-=dt; const have=units.filter(u=>u.alive&&u.kind==='courier'&&u.homePost===c).length; if(have<1&&c.cCD<=0){units.push(mk({kind:'courier',shipType:'courier',team:c.owner,x:c.x,y:c.y,tx:c.x,ty:c.y,troops:240,homePost:c,ttype:null}));c.cCD=10;} } }
  for(let t=0;t<NF;t++){ let yards=castles.filter(c=>c.owner===t&&c.shipyard); if(!yards.length)continue; const desired=Math.min(2,yards.length); const have=units.filter(u=>u.alive&&u.shipType==='warship'&&u.team===t).length; warCD[t]=Math.max(0,(warCD[t]||0)-dt);
    if(have<desired&&warCD[t]<=0){const w=nearWater(yards[0].x,yards[0].y);if(w){units.push(mk({kind:'warship',shipType:'warship',crew:'navy',naval:true,team:t,x:w.x,y:w.y,tx:w.x,ty:w.y,troops:1100,homePort:yards[0],ttype:null}));warCD[t]=15;}} } }
function updateTrade(dt){
  for(const c of castles){ if(!c.tradePost){c.escort=0;continue;} let e=0; for(const u of units)if(u.alive&&u.team===c.owner&&u.ttype===1&&!isShip(u)&&u.kind!=='courier'&&Math.hypot(u.x-c.x,u.y-c.y)<c.r+50)e+=u.troops; c.escort=e; } // 기마병참대(주둔 기병)
  for(const u of units){ if(!u.alive||!isCarrier(u))continue; const sea=u.shipType==='passenger'; const nodes=sea?castles.filter(c=>c.port):castles.filter(c=>c.tradePost);
    if(!u.laden){ let best=null,bd=1e9; for(const c of nodes){if(c===(u.homePort||u.homePost))continue;const d=Math.hypot(c.x-u.x,c.y-u.y);if(d<bd){bd=d;best=c;}}
      if(best){u.tx=best.x;u.ty=best.y;if(Math.hypot(u.x-best.x,u.y-best.y)<best.r+8){const raid=best.owner!==u.team?1.6:1.0;const esc=(u.homePost&&u.homePost.escort)||0;const cmul=u.kind==='courier'?1+Math.min(41,Math.floor(esc/100)*0.1):1;u.cargo=(20+Math.hypot(best.x-(u.homePort||u.homePost).x,best.y-(u.homePort||u.homePost).y)*0.05)*raid*cmul;u.laden=true;u.cargoType=raid>1?'약탈물':['곡물','장비','무기'][Math.floor(Math.random()*3)];}} }

  if(sel&&sel.length){for(const u of sel){if(!u.alive)continue;ctx.strokeStyle='#fff';ctx.lineWidth=1.5/cam.zoom;ctx.beginPath();ctx.arc(u.x,u.y,radius(u)+3/cam.zoom,0,7);ctx.stroke();}}
  for(const u of units){ if(!u.alive)continue; const col=tcolor(u.team),R=radius(u);
    if(isShip(u)||u.kind==='courier'){
      if(u.laden){ctx.setLineDash([4/cam.zoom,3/cam.zoom]);ctx.strokeStyle=col+'77';ctx.lineWidth=1/cam.zoom;ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(u.tx,u.ty);ctx.stroke();ctx.setLineDash([]);}
      ctx.fillStyle=col;ctx.globalAlpha=.95;ctx.beginPath();ctx.ellipse(u.x,u.y,R*1.4,R*.7,0,0,7);ctx.fill();ctx.globalAlpha=1; if(u.crew==='navy'){ctx.strokeStyle='#fde047';ctx.lineWidth=2/cam.zoom;ctx.stroke();}
      if(u.laden){ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(u.x,u.y-R,2.4/cam.zoom,0,7);ctx.fill();if(cam.zoom>1){ctx.fillStyle='#fde68a';ctx.font=`${7/cam.zoom}px sans-serif`;ctx.textAlign='center';ctx.fillText(u.cargoType||'',u.x,u.y+R+6/cam.zoom);}} continue; }
    if(u.atSea){ctx.fillStyle='#5b4636';ctx.beginPath();ctx.ellipse(u.x,u.y+R*.35,R*1.25,R*.55,0,0,7);ctx.fill();ctx.fillStyle='#caa472';ctx.fillRect(u.x-1/cam.zoom,u.y-R*.6,2/cam.zoom,R*.8);}
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(u.x,u.y+R*.55,R*.85,R*.38,0,0,7);ctx.fill();
    ctx.globalAlpha=.92;ctx.fillStyle=col;ctx.beginPath();ctx.arc(u.x,u.y,R,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=TCOL[u.ttype]||'#fff';ctx.lineWidth=1.5/cam.zoom;ctx.beginPath();ctx.arc(u.x,u.y,R-1/cam.zoom,0,7);ctx.stroke();
    if(cam.zoom>1.15){ctx.globalAlpha=.92;ctx.font=`${R}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(TICON[u.ttype],u.x,u.y);ctx.globalAlpha=1;}
    if(now-(u._hit||-9)<0.3){ctx.strokeStyle='#ff5a5a';ctx.lineWidth=2/cam.zoom;ctx.beginPath();ctx.arc(u.x,u.y,R+3/cam.zoom,0,7);ctx.stroke();}
    if(u.kind==='lord'){ctx.strokeStyle='#fff';ctx.lineWidth=2.4/cam.zoom;ctx.beginPath();ctx.arc(u.x,u.y,R+1.5/cam.zoom,0,7);ctx.stroke();if(FACTIONS[u.team]&&FACTIONS[u.team].crest)drawCrest(u.x,u.y-R-7/cam.zoom,4.4/cam.zoom,col);}
    if(cam.zoom>0.45){ctx.fillStyle='#fff';ctx.font=`bold ${8.5/cam.zoom}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3/cam.zoom;ctx.strokeStyle='#000a';ctx.strokeText(fmt(u.troops),u.x,u.y-R-4/cam.zoom);ctx.fillText(fmt(u.troops),u.x,u.y-R-4/cam.zoom);} }
  if(lord&&lord.alive){const d=Math.hypot(lord.tx-lord.x,lord.ty-lord.y);if(d>4){ctx.setLineDash([5/cam.zoom,5/cam.zoom]);ctx.strokeStyle='#fff8';ctx.lineWidth=1.5/cam.zoom;ctx.beginPath();ctx.moveTo(lord.x,lord.y);ctx.lineTo(lord.tx,lord.ty);ctx.stroke();ctx.setLineDash([]);}}
  if(train.on)drawRadial();
  drawMinimap(); updateHUD();
}
function drawRadial(){ const c=train.c;if(!c)return;const sc=w2s(c.x,c.y);ctx.setTransform(DPR,0,0,DPR,0,0);const p=train.cur||trainPick(c);
  ctx.setLineDash([6,6]);ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sc.x,sc.y);ctx.lineTo(train.sx,train.sy);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#ffffff33';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sc.x,sc.y,TRAIN_BAND,0,7);ctx.stroke();
  const ring=(T,R,act)=>{const n=T.length;for(let i=0;i<n;i++){const a=i*6.283/n,ix=sc.x+Math.cos(a)*R,iy=sc.y+Math.sin(a)*R,tg=T[i],s=act&&tg===p.target;ctx.globalAlpha=act?1:.5;ctx.beginPath();ctx.arc(ix,iy,s?20:14,0,7);ctx.fillStyle=s?'rgba(250,204,21,.95)':'rgba(15,20,30,.85)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=s?'#fff':'#fff8';ctx.stroke();ctx.font=`${s?17:12}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(tg==='coin'?'💰':TICON[tg],ix,iy);}ctx.globalAlpha=1;};
  ring(trainTier1(c),64,p.tier===1);ring(trainTier2(c),148,p.tier===2);
  let label,ok;const tg=p.target; if(tg==='coin'){label='💰예슈아화';ok=(gold[playerIdx]||0)>=30;}else{label=TICON[tg]+TNAME[tg];ok=c.reserve>=420&&(gold[playerIdx]||0)>=EQUIP[tg];}
  ctx.font='bold 12px sans-serif';ctx.fillStyle=ok?'#86efac':'#fca5a5';ctx.fillText(label+' ⚡'+p.rate.toFixed(1),train.sx,train.sy-24); }
function drawZone(){ const Z=zone,W=VW(),H=VH(),Lu=lord; ctx.setTransform(DPR,0,0,DPR,0,0);
  const bgc=['#1f2b3a','#22303f','#574629','#444d28','#23381e','#39332e','#363a41','#525a64'][Z.terr]||'#26301f';
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,bgc);g.addColorStop(1,'#10160e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(Z.seaY>0){const sg=ctx.createLinearGradient(0,0,0,Z.seaY);sg.addColorStop(0,'#1d4e6b');sg.addColorStop(1,'#2a6f8e');ctx.fillStyle=sg;ctx.fillRect(0,0,W,Z.seaY);ctx.strokeStyle='#dff0ff88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,Z.seaY);ctx.lineTo(W,Z.seaY);ctx.stroke();for(let s=0;s<3;s++){const hx=W*(.2+.3*s);ctx.fillStyle='#3a2c1e';ctx.beginPath();ctx.ellipse(hx,Z.seaY*.5,18,6,0,0,7);ctx.fill();}ctx.fillStyle='#dff0ffcc';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('🌊 상륙 해안',W/2,12);}
  for(const b of Z.blocks){if(b.troops<=0)continue;const col=tcolor(b.team);if(b.ft>0){ctx.strokeStyle='rgba(255,240,150,'+b.ft*2+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.fx,b.fy);ctx.stroke();}
    ctx.globalAlpha=.26;ctx.fillStyle=col;ctx.beginPath();ctx.arc(b.x,b.y,ZBR,0,7);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=TCOL[b.ttype]||'#fff';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(b.x,b.y,ZBR-1,0,7);ctx.stroke();
    const cnt=Math.min(9,Math.max(3,Math.round(b.troops/55)));for(let k=0;k<cnt;k++){const a=k*2.39+Z.t*2.2,rr=ZBR*(.32+.45*((k*7%5)/5));ctx.fillStyle=col;ctx.beginPath();ctx.arc(b.x+Math.cos(a)*rr,b.y+Math.sin(a*1.27)*rr,2,0,7);ctx.fill();}}
  if(Lu.alive){if(Z.ltx!=null){ctx.setLineDash([5,5]);ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(Z.lx,Z.ly);ctx.lineTo(Z.ltx,Z.lty);ctx.stroke();ctx.setLineDash([]);}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(Z.lx,Z.ly,ZLR+3,0,7);ctx.fill();ctx.fillStyle=tcolor(Lu.team);ctx.beginPath();ctx.arc(Z.lx,Z.ly,ZLR,0,7);ctx.fill();
    ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(fmt(Lu.troops),Z.lx,Z.ly-ZLR-8);ctx.fillStyle='#fff';ctx.fillText(fmt(Lu.troops),Z.lx,Z.ly-ZLR-8);}
  let af=Lu.alive?Lu.troops:0,ff=0;for(const b of Z.blocks){if(b.side===0)af+=b.troops;else ff+=b.troops;}
  ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.fillStyle='#9be7a0';ctx.fillText('아군 '+fmt(af),10,20);ctx.textAlign='right';ctx.fillStyle='#fca5a5';ctx.fillText('적 '+fmt(ff),W-10,20);
  ctx.textAlign='center';ctx.fillStyle='#ffd966';ctx.font='bold 12px sans-serif';ctx.fillText('⚔ '+Z.terrName+(Z.coastal?' 상륙전':' 전투')+' · 탭=이동',W/2,20);
  const bw=80,bh=28,bx=W/2-bw/2,by=H-bh-8;Z.btn={x:bx,y:by,w:bw,h:bh};ctx.fillStyle='#000a';ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textBaseline='middle';ctx.fillText('⮜ 후퇴',W/2,by+bh/2); }
function drawMinimap(){ ctx.setTransform(DPR,0,0,DPR,0,0); const mw=88,mh=mw*WH/WW,mx=VW()-mw-8,my=VH()-mh-20,sx=mw/WW,sy=mh/WH;
  ctx.globalAlpha=.85;ctx.drawImage(land,mx,my,mw,mh);ctx.globalAlpha=.55;ctx.drawImage(tintC,mx,my,mw,mh);ctx.globalAlpha=1;
  ctx.strokeStyle='#fff9';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
  for(const c of castles){if(c.owner<0)continue;ctx.fillStyle=tcolor(c.owner);ctx.fillRect(mx+c.x*sx-1,my+c.y*sy-1,2.4,2.4);}
  for(const u of units){if(!u.alive||isCarrier(u))continue;ctx.fillStyle=tcolor(u.team);const s=u.kind==='lord'?3:1.5;ctx.fillRect(mx+u.x*sx-s/2,my+u.y*sy-s/2,s,s);}
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(mx+cam.x*sx,my+cam.y*sy,VW()/cam.zoom*sx,VH()/cam.zoom*sy); }
function updateHUD(){ if(playerIdx<0||!FACTIONS[playerIdx])return; const f=FACTIONS[playerIdx];
  el('hFac').textContent=(f.crest?'✦ ':'')+f.name; el('hTroops').textContent='⚔'+fmt(lord?lord.troops:0);
  el('hType').textContent=lord?TICON[lord.ttype]+TNAME[lord.ttype]:''; el('hGold').textContent='💰'+Math.floor(gold[playerIdx]||0);
  el('hCoin').textContent='✦'+Math.floor(lord?lord.coin:0); el('hCastle').textContent='🏰'+ownedCount(playerIdx);
  const sb=el('shopBtn'),ns=nearestShop(),townOpen=!panel.classList.contains('hidden'); sb.classList.toggle('hidden',!ns||!!shopC||townOpen); if(ns&&!shopC&&!townOpen)sb.textContent='🛒 '+(ns.owner<NF?FACTIONS[ns.owner].name:'무소속'); }
const el=id=>document.getElementById(id);

// ===== 입력 =====
let drag=null,pinch=null,moved=false,downC=null,pressT=0;
function onDown(x,y){ if(zone){ return; }
  if(state!=='play')return; moved=false;
  // 내 성?
  const w=s2w(x,y); downC=null;
  for(const c of castles){ if(c.owner===playerIdx&&Math.hypot(c.x-w.x,c.y-w.y)<c.r+6){downC=c;pressT=now;break;} }
  drag={x,y,cx:cam.x,cy:cam.y}; }
function onMove(x,y){ if(zone)return; if(pinch)return;
  if(downC&&!train.on){ const d=Math.hypot(x-drag.x,y-drag.y); if(d>14){ train.on=true;train.c=downC;train.accum=0; } }
  if(train.on){ train.sx=x;train.sy=y; return; }
  if(drag){const dx=x-drag.x,dy=y-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;cam.x=drag.cx-dx/cam.zoom;cam.y=drag.cy-dy/cam.zoom;clampCam();} }
function onUp(x,y){ if(zone){ if(zone.btn&&x>=zone.btn.x&&x<=zone.btn.x+zone.btn.w&&y>=zone.btn.y&&y<=zone.btn.y+zone.btn.h){exitZone();return;} zone.ltx=x;zone.lty=y; return; }
  if(train.on){train.on=false;downC=null;drag=null;return;}
  if(drag&&!moved&&state==='play'){ const w=s2w(x,y);
    if(downC){ openTown(downC); downC=null;drag=null;return; }
    // 적/유닛/이동
    closePanel();
    // 내 영주 탭=선택해제
    if(lord&&lord.alive&&Math.hypot(lord.x-w.x,lord.y-w.y)<radius(lord)+12/cam.zoom){sel=null;drag=null;return;}
    // 내 다른 부대 탭=함대 선택
    for(const u of units){if(u.alive&&u!==lord&&u.team===playerIdx&&u.kind!=='courier'&&Math.hypot(u.x-w.x,u.y-w.y)<radius(u)+12/cam.zoom){sel=units.filter(o=>o.alive&&o!==lord&&o.team===playerIdx&&o.kind!=='courier'&&Math.hypot(o.x-u.x,o.y-u.y)<150);drag=null;return;}}
    if(sel&&sel.length){let k=0;for(const s of sel){if(!s.alive)continue;s.target=null;s.tx=clamp(w.x+(k%5-2)*16,4,WW-4);s.ty=clamp(w.y+((k/5|0))*16,4,WH-4);k++;}drag=null;return;}
    if(lord&&lord.alive){let tg=null,bd=40/cam.zoom;for(const u of units){if(!u.alive||u.team===lord.team||isCarrier(u))continue;const d=Math.hypot(u.x-w.x,u.y-w.y);if(d<bd){bd=d;tg=u;}}if(tg){lord.target=tg;lord.tx=tg.x;lord.ty=tg.y;}else{lord.target=null;lord.tx=clamp(w.x,4,WW-4);lord.ty=clamp(w.y,4,WH-4);}}
  } downC=null;drag=null; }
function td(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
cv.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===2){pinch={d:td(e),z:cam.zoom};drag=null;train.on=false;}else onDown(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(pinch&&e.touches.length===2){const nd=td(e),ox=(e.touches[0].clientX+e.touches[1].clientX)/2,oy=(e.touches[0].clientY+e.touches[1].clientY)/2,w=s2w(ox,oy);cam.zoom=clamp(pinch.z*nd/pinch.d,camMin(),3.4);cam.x=w.x-ox/cam.zoom;cam.y=w.y-oy/cam.zoom;clampCam();}else onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(pinch){pinch=null;return;}const t=e.changedTouches[0];onUp(t.clientX,t.clientY);},{passive:false});
let mdn=false;cv.addEventListener('mousedown',e=>{mdn=true;onDown(e.clientX,e.clientY);});
addEventListener('mousemove',e=>{if(mdn)onMove(e.clientX,e.clientY);});
addEventListener('mouseup',e=>{if(mdn){mdn=false;onUp(e.clientX,e.clientY);}});
addEventListener('wheel',e=>{if(zone)return;const w=s2w(e.clientX,e.clientY);cam.zoom=clamp(cam.zoom*(e.deltaY<0?1.1:.9),camMin(),3.4);cam.x=w.x-e.clientX/cam.zoom;cam.y=w.y-e.clientY/cam.zoom;clampCam();},{passive:true});
el('shopBtn').addEventListener('click',()=>{const c=nearestShop();if(c)openShop(c);});

// ===== 게임오버 =====
function endGame(win){ if(state==='over')return; state='over'; el('overT').textContent=win?'👑 통일':'💀 패배'; el('overD').textContent=win?'대륙을 통일했습니다!':'영주가 쓰러졌습니다…'; el('over').classList.remove('hidden'); el('hud').classList.add('hidden'); el('shopBtn').classList.add('hidden'); closePanel(); }

// ===== 시작화면 / 루프 =====
function buildMenu(){ const fl=el('fl'); for(let i=0;i<PLAY;i++){const f=FACTIONS[i];const b=document.createElement('button');b.className='fb';b.style.background=f.color;b.style.color=['#f5d442','#84cc16','#38bdf8','#94a3b8'].includes(f.color)?'#10151f':'#fff';b.innerHTML=(f.crest?'✦ ':'')+f.name+'<small>영웅 '+f.hero+' — '+f.desc+'</small>';b.onclick=()=>startGame(i);fl.appendChild(b);} }
let last=0;
function loop(t){ const dt=Math.min(0.05,(t-last)/1000)||0; last=t;
  if(state==='play'){ if(zoneCD>0)zoneCD-=dt; if(!zone){const tb=detectBattle();if(tb)enterZone(tb);} if(zone)updateZone(dt); else update(dt); }
  draw(); requestAnimationFrame(loop); }
genWorld(); placeCastles(); computeLand(); buildRegions(); buildTerritory(); buildMenu();
cam.x=0;cam.y=0;cam.zoom=camMin(); requestAnimationFrame(loop);
</script>
