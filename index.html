<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>7세력 전쟁 — RTS RPG</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e14;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
  #game { display:block; position:absolute; left:0; top:0; touch-action:none; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:24px;
    background:rgba(8,10,18,0.92); color:#eef; text-align:center; z-index:10; }
  .overlay h1 { font-size:24px; letter-spacing:1px; }
  .overlay h2 { font-size:30px; }
  .overlay p { font-size:14px; color:#9aa; line-height:1.6; max-width:340px; }
  .factions { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; width:100%; max-width:360px; }
  .fbtn { padding:12px; border:none; border-radius:12px; color:#fff; font-size:15px;
    font-weight:700; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,0.35); }
  .fbtn small { display:block; font-size:11px; font-weight:400; opacity:0.85; margin-top:3px; }
  .btn { padding:14px 30px; border:none; border-radius:14px; background:#3b82f6;
    color:#fff; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 3px 0 #1d4ed8; }

  #hud { position:absolute; left:0; top:0; right:0; padding:8px 12px;
    display:flex; justify-content:space-between; align-items:flex-start;
    color:#fff; font-size:12px; pointer-events:none; z-index:5;
    text-shadow:0 1px 2px #000; }
  #hud .panel { background:rgba(10,14,24,0.55); padding:7px 10px; border-radius:10px; }
  #barWrap { width:120px; height:6px; background:#333; border-radius:4px; margin-top:4px; overflow:hidden; }
  #hpBar { height:100%; width:100%; background:#34d399; }
  #xpBar { height:100%; width:0%; background:#fbbf24; }
  .lab { color:#9ab; font-size:10px; }
  #hint { position:absolute; left:0; right:0; bottom:14px; text-align:center;
    color:#cde; font-size:12px; pointer-events:none; z-index:5; text-shadow:0 1px 2px #000; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="panel">
    <div id="heroName">영웅</div>
    <div class="lab">HP</div><div id="barWrap"><div id="hpBar"></div></div>
    <div class="lab" style="margin-top:3px">EXP (Lv <span id="lvl">1</span>)</div>
    <div id="barWrap" style="background:#333;width:120px;height:6px;border-radius:4px;margin-top:4px;overflow:hidden"><div id="xpBar"></div></div>
  </div>
  <div class="panel" style="text-align:right">
    <div>⚔️ 병사 <span id="troops">0</span></div>
    <div>🏰 거점 <span id="bases">0</span>/7</div>
    <div id="clock" style="color:#9ab"></div>
  </div>
</div>
<div id="hint" class="hidden">탭: 이동 · 적/거점 탭: 공격·점령</div>

<div id="startScreen" class="overlay">
  <h1>⚔️ 7세력 전쟁 ⚔️</h1>
  <p>7개 세력, 7명의 영웅이 한 전장에서 충돌한다.<br>
     부대를 이끌고 거점을 점령하라. 모든 거점을 차지하면 승리!</p>
  <p style="color:#cde">플레이할 세력을 고르세요</p>
  <div class="factions" id="factionList"></div>
</div>

<div id="endScreen" class="overlay hidden">
  <h2 id="endTitle"></h2>
  <p id="endMsg"></p>
  <button class="btn" onclick="location.reload()">다시 하기</button>
</div>

<script>
// ====== 세력 & 영웅 데이터 ======
const FACTIONS = [
  { name:"빛의 군단",   hero:"세라핌",  color:"#f5d442", glow:"#fff3b0" },
  { name:"어둠의 결사", hero:"녹스",    color:"#a855f7", glow:"#d8b4fe" },
  { name:"불꽃 부족",   hero:"이그니스",color:"#f97316", glow:"#fdba74" },
  { name:"서리 왕국",   hero:"글라키",  color:"#38bdf8", glow:"#bae6fd" },
  { name:"대지 연맹",   hero:"테라",    color:"#84cc16", glow:"#d9f99d" },
  { name:"폭풍 해적단", hero:"마엘",    color:"#3b82f6", glow:"#93c5fd" },
  { name:"강철 제국",   hero:"펠릭스",  color:"#94a3b8", glow:"#e2e8f0" },
];

// 월드 좌표 (세로 모바일)
const W = 720, H = 1280;
const BASE_POS = [
  {x:360,y:1150},{x:130,y:980},{x:590,y:980},
  {x:360,y:690},{x:130,y:380},{x:590,y:380},{x:360,y:140},
];

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let scale=1, offX=0, offY=0;

function resize(){
  const ww=window.innerWidth, wh=window.innerHeight;
  scale=Math.min(ww/W, wh/H);
  offX=(ww-W*scale)/2; offY=(wh-H*scale)/2;
  cv.width=ww; cv.height=wh;
}
window.addEventListener('resize',resize); resize();
function toWorld(sx,sy){ return { x:(sx-offX)/scale, y:(sy-offY)/scale }; }

// ====== 게임 상태 ======
let state='select', playerIdx=0, armies=[], bases=[], elapsed=0, lastT=0;

function makeArmy(i){
  const f=FACTIONS[i], p=BASE_POS[i];
  return {
    id:i, name:f.hero, color:f.color, glow:f.glow,
    x:p.x, y:p.y, tx:p.x, ty:p.y,
    troops:24, alive:true,
    lvl:1, xp:0, xpNeed:100,
    hp:120, maxHp:120, atk:12,
    targetArmy:null, attackMove:false,
    capProg:0, capBase:-1,
  };
}

function startGame(idx){
  playerIdx=idx;
  armies=FACTIONS.map((_,i)=>makeArmy(i));
  bases=BASE_POS.map((p,i)=>({x:p.x,y:p.y,owner:i,r:34}));
  elapsed=0; state='play'; lastT=performance.now();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  document.getElementById('heroName').textContent=FACTIONS[idx].name+" · "+FACTIONS[idx].hero;
  requestAnimationFrame(loop);
}

// ====== 입력 ======
function handleTap(sx,sy){
  if(state!=='play') return;
  const me=armies[playerIdx]; if(!me.alive) return;
  const w=toWorld(sx,sy);
  // 적 부대 클릭?
  let target=null, best=44;
  for(const a of armies){
    if(a.id===playerIdx||!a.alive) continue;
    const d=Math.hypot(a.x-w.x,a.y-w.y);
    if(d<best){ best=d; target=a; }
  }
  if(target){ me.targetArmy=target; me.attackMove=true; me.tx=target.x; me.ty=target.y; return; }
  // 그 외: 이동 (거점도 이동으로 처리되며 도착 시 자동 점령)
  me.targetArmy=null; me.attackMove=false;
  me.tx=Math.max(20,Math.min(W-20,w.x));
  me.ty=Math.max(20,Math.min(H-20,w.y));
}
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];handleTap(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('mousedown',e=>handleTap(e.clientX,e.clientY));

// ====== AI ======
function aiThink(a){
  if(!a.alive) return;
  // 교전 중이면 유지
  if(a.targetArmy && a.targetArmy.alive && Math.hypot(a.targetArmy.x-a.x,a.targetArmy.y-a.y)<60){
    a.tx=a.targetArmy.x; a.ty=a.targetArmy.y; return;
  }
  a.targetArmy=null; a.attackMove=false;
  // 자기 소유가 아닌 가장 가까운 거점으로
  let tb=null, bd=1e9;
  for(const b of bases){
    if(b.owner===a.id) continue;
    const d=Math.hypot(b.x-a.x,b.y-a.y);
    if(d<bd){ bd=d; tb=b; }
  }
  // 근처에 약한 적 부대가 있으면 공격
  let weak=null, wd=260;
  for(const o of armies){
    if(o.id===a.id||!o.alive) continue;
    const d=Math.hypot(o.x-a.x,o.y-a.y);
    if(d<wd && (o.troops+o.lvl*3) < (a.troops+a.lvl*3)*1.15){ wd=d; weak=o; }
  }
  if(weak){ a.targetArmy=weak; a.attackMove=true; a.tx=weak.x; a.ty=weak.y; }
  else if(tb){ a.tx=tb.x; a.ty=tb.y; }
}
let aiTimer=0;

// ====== 업데이트 ======
function power(a){ return a.troops + a.atk + a.lvl*4; }

function update(dt){
  elapsed+=dt;
  aiTimer-=dt;
  if(aiTimer<=0){ aiTimer=0.6; for(const a of armies) if(a.id!==playerIdx) aiThink(a); }

  // 이동
  for(const a of armies){
    if(!a.alive) continue;
    const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    const sp=78*dt;
    if(d>2){ const m=Math.min(sp,d); a.x+=dx/d*m; a.y+=dy/d*m; }
  }

  // 전투 (교전 거리 내 적끼리)
  for(let i=0;i<armies.length;i++){
    const A=armies[i]; if(!A.alive) continue;
    for(let j=i+1;j<armies.length;j++){
      const B=armies[j]; if(!B.alive) continue;
      if(Math.hypot(A.x-B.x,A.y-B.y)<46){
        fight(A,B,dt); fight(B,A,dt);
      }
    }
  }

  // 거점 점령 + 병력 보충
  for(const a of armies){
    if(!a.alive) continue;
    let onEnemyBase=null;
    for(const b of bases){
      if(Math.hypot(b.x-a.x,b.y-a.y)<b.r){
        if(b.owner!==a.id){
          // 적 부대가 같은 거점에서 교전 중이면 점령 보류
          let contested=false;
          for(const o of armies){ if(o.alive&&o.id!==a.id&&Math.hypot(o.x-b.x,o.y-b.y)<b.r){contested=true;break;} }
          if(!contested) onEnemyBase=b;
        }
      }
    }
    if(onEnemyBase){
      if(a.capBase!==onEnemyBase){ a.capBase=onEnemyBase; a.capProg=0; }
      a.capProg+=dt;
      if(a.capProg>=2.0){ onEnemyBase.owner=a.id; a.capProg=0; a.capBase=-1; }
    } else { a.capBase=-1; a.capProg=0; }
  }

  // 거점 보충: 자기 거점 1개당 +0.7병사/초
  for(const a of armies){
    if(!a.alive) continue;
    let owned=0; for(const b of bases) if(b.owner===a.id) owned++;
    a.troops=Math.min(220, a.troops+owned*0.7*dt);
    if(a.hp<a.maxHp) a.hp=Math.min(a.maxHp,a.hp+owned*1.5*dt);
  }

  checkEnd();
}

function fight(att,def,dt){
  const dmg=power(att)*0.45*dt*(0.85+Math.random()*0.3);
  if(def.troops>0.5){
    def.troops-=dmg;
    if(def.troops<0){ def.hp+=def.troops*4; def.troops=0; }
  } else {
    def.hp-=dmg*4;
  }
  if(def.hp<=0){ destroyArmy(def, att); }
}

function destroyArmy(dead, killer){
  dead.alive=false; dead.troops=0;
  // 영웅 처치 보상
  killer.xp+=60; killer.troops=Math.min(220,killer.troops+15);
  while(killer.xp>=killer.xpNeed){
    killer.xp-=killer.xpNeed; killer.lvl++;
    killer.xpNeed=Math.round(killer.xpNeed*1.4);
    killer.maxHp+=40; killer.hp=killer.maxHp; killer.atk+=6;
  }
  // 죽은 세력 거점은 중립화하지 않고 그대로 두되, 점령 가능
  killer.targetArmy=null; killer.attackMove=false;
}

function checkEnd(){
  const me=armies[playerIdx];
  let owned=0; for(const b of bases) if(b.owner===playerIdx) owned++;
  if(!me.alive){ endGame(false,"당신의 영웅이 쓰러졌습니다…"); return; }
  if(owned===bases.length){ endGame(true,`${FACTIONS[playerIdx].name}이(가) 전장을 통일했습니다!`); return; }
}

let ended=false;
function endGame(win,msg){
  if(ended) return; ended=true; state='end';
  document.getElementById('endScreen').classList.remove('hidden');
  document.getElementById('endTitle').textContent= win? "🏆 승리!" : "💀 패배";
  document.getElementById('endMsg').textContent=msg+` (생존 ${elapsed.toFixed(0)}초)`;
}

// ====== 렌더 ======
function draw(){
  ctx.save();
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.translate(offX,offY); ctx.scale(scale,scale);

  // 배경
  ctx.fillStyle='#10151f'; ctx.fillRect(0,0,W,H);
  // 격자
  ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // 거점 간 연결선
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=2;
  const links=[[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[4,6],[5,6],[1,2],[4,5]];
  for(const[a,b]of links){ctx.beginPath();ctx.moveTo(bases[a].x,bases[a].y);ctx.lineTo(bases[b].x,bases[b].y);ctx.stroke();}

  // 거점
  for(const b of bases){
    const c=FACTIONS[b.owner].color;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7);
    ctx.fillStyle='rgba(20,26,38,0.9)'; ctx.fill();
    ctx.lineWidth=5; ctx.strokeStyle=c; ctx.stroke();
    ctx.fillStyle=c; ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🏰',b.x,b.y);
  }

  // 점령 진행 표시
  for(const a of armies){
    if(a.alive && a.capBase && a.capBase!==-1 && a.capProg>0){
      const b=a.capBase;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r+6,-Math.PI/2,-Math.PI/2+ (a.capProg/2)*Math.PI*2);
      ctx.lineWidth=4; ctx.strokeStyle=a.color; ctx.stroke();
    }
  }

  // 부대
  for(const a of armies){
    if(!a.alive) continue;
    const isMe=a.id===playerIdx;
    // 이동 목표선 (내 부대만)
    if(isMe && (Math.abs(a.tx-a.x)>3||Math.abs(a.ty-a.y)>3)){
      ctx.beginPath(); ctx.setLineDash([6,6]); ctx.moveTo(a.x,a.y); ctx.lineTo(a.tx,a.ty);
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
    }
    const rad=14+Math.min(16,a.troops/12);
    // 글로우
    ctx.beginPath(); ctx.arc(a.x,a.y,rad+6,0,7);
    ctx.fillStyle=a.glow+'33'; ctx.fill();
    // 본체
    ctx.beginPath(); ctx.arc(a.x,a.y,rad,0,7);
    ctx.fillStyle=a.color; ctx.fill();
    ctx.lineWidth= isMe?3:2; ctx.strokeStyle= isMe?'#fff':'rgba(0,0,0,0.4)'; ctx.stroke();
    // 병사 수
    ctx.fillStyle='#10151f'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(Math.ceil(a.troops),a.x,a.y);
    // 영웅 HP 바
    const bw=rad*2, hp=a.hp/a.maxHp;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(a.x-bw/2,a.y-rad-9,bw,4);
    ctx.fillStyle= hp>0.4?'#34d399':'#f87171'; ctx.fillRect(a.x-bw/2,a.y-rad-9,bw*hp,4);
    // 이름표
    ctx.fillStyle='#dbeafe'; ctx.font='10px sans-serif';
    ctx.fillText('Lv'+a.lvl+' '+a.name, a.x, a.y+rad+11);
  }

  ctx.restore();
}

function updateHUD(){
  const me=armies[playerIdx];
  document.getElementById('hpBar').style.width=Math.max(0,me.hp/me.maxHp*100)+'%';
  document.getElementById('xpBar').style.width=(me.xp/me.xpNeed*100)+'%';
  document.getElementById('lvl').textContent=me.lvl;
  document.getElementById('troops').textContent=Math.ceil(me.troops);
  let owned=0; for(const b of bases) if(b.owner===playerIdx) owned++;
  document.getElementById('bases').textContent=owned;
  document.getElementById('clock').textContent=elapsed.toFixed(0)+'s';
}

// ====== 루프 ======
function loop(t){
  const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  if(state==='play'){ update(dt); updateHUD(); }
  draw();
  if(state!=='end') requestAnimationFrame(loop);
  else draw();
}

// ====== 세력 선택 UI ======
const list=document.getElementById('factionList');
FACTIONS.forEach((f,i)=>{
  const b=document.createElement('button');
  b.className='fbtn'; b.style.background=f.color;
  b.style.color = ['#f5d442','#84cc16','#38bdf8','#94a3b8'].includes(f.color)?'#10151f':'#fff';
  b.innerHTML=f.name+'<small>영웅: '+f.hero+'</small>';
  b.onclick=()=>startGame(i);
  list.appendChild(b);
});
</script>
</body>
</html>
