<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>예슈아 월드맵 전쟁</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:#05070c;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#e8eef5;touch-action:none}
  #cv{display:block;position:fixed;inset:0}
  .hidden{display:none!important}
  #hud{position:fixed;top:0;left:0;right:0;padding:8px 10px;display:flex;gap:10px;align-items:center;
    background:linear-gradient(#0a0f18cc,#0a0f1800);font-size:12px;font-weight:700;pointer-events:none;z-index:5}
  #hud .pill{background:#0d1422cc;border:1px solid #ffffff22;border-radius:9px;padding:4px 8px}
  #hud .grow{flex:1}
  #start{position:fixed;inset:0;z-index:20;overflow:auto;background:radial-gradient(120% 80% at 50% 0%,#13233a,#05070c)}
  #start .wrap{max-width:460px;margin:0 auto;padding:38px 18px 60px;text-align:center}
  #start h1{font-size:24px;margin-bottom:6px;letter-spacing:1px}
  #start p{font-size:13px;color:#9fb2c8;line-height:1.6;margin-bottom:6px}
  #fl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .fb{border:none;border-radius:13px;padding:13px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;
    box-shadow:0 4px 0 #0006,0 6px 14px #0007;text-align:left;line-height:1.35}
  .fb small{display:block;font-size:10.5px;font-weight:500;opacity:.9;margin-top:3px}
  #hint{position:fixed;left:0;right:0;bottom:0;padding:6px;text-align:center;font-size:11px;color:#9fb2c8;
    background:linear-gradient(#0a0f1800,#0a0f18cc);pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <span class="pill" id="hFac">—</span>
  <span class="pill" id="hTroops">⚔ 0</span>
  <span class="pill" id="hGold">💰 0</span>
  <span class="grow"></span>
  <span class="pill" id="hCastle">🏰 0</span>
</div>
<div id="hint" class="hidden">탭=영주 이동 · 끌기=지도 이동 · 두 손가락=확대</div>
<div id="start"><div class="wrap">
  <h1>⚔️ 예슈아 월드맵 전쟁</h1>
  <p>7세력·충성 7·무소속 7이 대륙을 다툰다.<br>성을 가진 자만 병력을 만들고, 모두 잃으면 떠도는 개인이 된다.</p>
  <p style="color:#cfe;margin-top:10px">플레이할 세력을 고르세요</p>
  <div id="fl"></div>
</div></div>
<script>
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; }
addEventListener('resize',resize); resize();
const VW=()=>cv.width/DPR, VH=()=>cv.height/DPR;

// ===== 데이터 =====
const WW=1200, WH=1800;                                   // 월드 크기
const FACTIONS=[
  {name:"예슈아한민족국", hero:"예슈아", color:"#f5d442", crest:true, desc:"참 선지자 예슈아의 백성"},
  {name:"밤마루 겨레",   hero:"검불",  color:"#a855f7", desc:"밤 골짜기를 내달리는 겨레"},
  {name:"노을 누리",     hero:"한별",  color:"#f97316", desc:"붉은 노을의 떠돌이 겨레"},
  {name:"눈벌 한",       hero:"흰메",  color:"#38bdf8", desc:"얼어붙은 북녘의 무리"},
  {name:"푸른들 두레",   hero:"벌하",  color:"#84cc16", desc:"드넓은 풀벌의 두레"},
  {name:"큰물 무리",     hero:"미르",  color:"#3b82f6", desc:"바다·큰 강의 물길 무리"},
  {name:"무쇠 골",       hero:"검쇠",  color:"#94a3b8", desc:"무쇠를 벼리는 골 사람들"},
];
const NF=FACTIONS.length;

// ===== 노이즈 =====
function hash(x,y){ let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0; h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967295; }
function vnoise(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ let s=0,a=.5,f=1; for(let i=0;i<5;i++){ s+=a*vnoise(x*f,y*f); f*=2; a*=.5; } return s/0.96875; }

// ===== 월드 생성 (음영기복 현실감 / 저사양: 절반해상 1회 렌더 후 캐시) =====
const LW=600, LH=900, LS=WW/LW;                            // 지형 캐시 해상도(절반)
const SEA=0.42;                                            // 해수면
const land=document.createElement('canvas'); land.width=LW; land.height=LH;
let elevAt;                                                // 월드좌표 고도 샘플러
function biome(e,m){ // [r,g,b]
  if(e<SEA){ const t=Math.max(0,e/SEA); // 심해→연안
    return [18+ t*40, 46+t*70, 82+t*60]; }
  if(e<SEA+0.018) return [214,200,150];                    // 해변
  const le=(e-SEA)/(1-SEA);                                // 0~1 육지 고도
  if(le>0.82) return [236,240,245];                        // 만년설
  if(le>0.62){ const k=(le-0.62)/0.2; return [120-k*30,116-k*28,112-k*26]; } // 바위산
  if(le>0.44){ return m<0.45?[150,140,96]:[96,120,70]; }   // 구릉(건/습)
  if(m<0.30) return [205,186,120];                         // 사막
  if(m<0.45) return [183,176,104];                         // 사바나
  if(m<0.66) return [126,162,88];                          // 초원
  return [60,116,66];                                      // 삼림
}
function genWorld(){
  const sc=120, ox=hash(7,3)*1000, oy=hash(11,5)*1000, mx=hash(2,9)*1000, my=hash(4,1)*1000;
  const E=new Float32Array(LW*LH), M=new Float32Array(LW*LH);
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){ const i=y*LW+x;
    let e=fbm((x)/sc+ox,(y)/sc+oy);
    const dx=Math.abs(x/LW*2-1), dy=Math.abs(y/LH*2-1);    // 가장자리=바다(섬형 대륙)
    e-= Math.pow(Math.max(dx,dy),2.4)*0.42;
    E[i]=e; M[i]=fbm(x/90+mx,y/90+my);
  }
  elevAt=(wx,wy)=>{ const x=Math.max(0,Math.min(LW-1,wx/LS|0)), y=Math.max(0,Math.min(LH-1,wy/LS|0)); return E[y*LW+x]; };
  const img=ctx.createImageData(LW,LH), d=img.data;
  const Lx=-0.55,Ly=-0.62,Lz=0.56;                         // 광원(좌상)
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){ const i=y*LW+x;
    const e=E[i], c=biome(e,M[i]);
    let r=c[0],g=c[1],b=c[2];
    if(e>=SEA){ // 음영기복(육지)
      const ex=E[i+(x<LW-1?1:0)], ey=E[i+(y<LH-1?LW:0)];
      let nx=(e-ex)*11, ny=(e-ey)*11, nl=Math.sqrt(nx*nx+ny*ny+1);
      let sh=(nx*Lx+ny*Ly+Lz)/nl; sh=0.5+0.8*Math.max(0,Math.min(1,(sh+0.15)));   // 음영 강화
      r*=sh; g*=sh; b*=sh;
      const le=(e-SEA)/(1-SEA);
      if(le<0.02){ r=r*.5+200*.5; g=g*.5+190*.5; b=b*.5+150*.5; }                 // 해안 모래톱
      if(le>0.6){ const sp=Math.max(0,(sh-1.05)*1.6); r+=sp*70;g+=sp*70;b+=sp*72; } // 능선 하이라이트
    } else { // 바다: 깊이 음영 + 잔물결 + 해안 서프
      const w=Math.sin((x*0.9+y)*0.22+vnoise(x/22,y/22)*6)*4; r+=w;g+=w;b+=w;
      if(e>SEA-0.018){ const s=(e-(SEA-0.018))/0.018; r+=s*55;g+=s*60;b+=s*45; }    // 서프 라인
    }
    const p=i*4; d[p]=r; d[p+1]=g; d[p+2]=b; d[p+3]=255;
  }
  land.getContext('2d').putImageData(img,0,0);
}

// ===== 정착지 / 영역 =====
const GC=20, GX=Math.ceil(WW/GC), GY=Math.ceil(WH/GC);
let castles=[], owner=new Int16Array(GX*GY), owId=new Int16Array(GX*GY), borderPath=null;
const tintC=document.createElement('canvas'); tintC.width=GX; tintC.height=GY;
function paintTint(){ const g=tintC.getContext('2d'); g.clearRect(0,0,GX,GY);
  for(let gy=0;gy<GY;gy++)for(let gx=0;gx<GX;gx++){ const t=owner[gy*GX+gx]; if(t<0)continue; g.fillStyle=tcolor(t); g.fillRect(gx,gy,1,1); } }
const TIER=[{n:"촌락",r:13},{n:"마을",r:16},{n:"중규모 마을",r:19},{n:"대규모 마을",r:23},{n:"도시",r:28},{n:"중규모 도시",r:32},{n:"대규모 도시",r:37}];
function placeCastles(){
  castles=[]; let tries=0;
  while(castles.length<46 && tries<4000){ tries++;
    const x=40+Math.random()*(WW-80), y=40+Math.random()*(WH-80);
    if(elevAt(x,y)<SEA+0.03 || elevAt(x,y)>SEA+0.55) continue;        // 육지·산악 아님
    let ok=true; for(const c of castles) if(Math.hypot(c.x-x,c.y-y)<90){ok=false;break;}
    if(!ok) continue;
    const rr=Math.random(), t= rr<.28?0: rr<.5?1: rr<.68?2: rr<.82?3: rr<.92?4: rr<.975?5:6;
    castles.push({x,y,t,r:TIER[t].r,owner:-1,fort:t>=4?t-3:0,cap:0,capProg:0,barr:1+(t/2|0),gold:0});
  }
}
function buildTerritory(){
  for(let gy=0;gy<GY;gy++)for(let gx=0;gx<GX;gx++){ const i=gy*GX+gx, wx=gx*GC+GC/2, wy=gy*GC+GC/2;
    if(elevAt(wx,wy)<SEA){ owner[i]=-2; owId[i]=-1; continue; }       // 바다
    let bi=-1,bd=1e9; for(let k=0;k<castles.length;k++){ const d=(castles[k].x-wx)**2+(castles[k].y-wy)**2; if(d<bd){bd=d;bi=k;} }
    owId[i]=bi; owner[i]=bi>=0?castles[bi].owner:-1;
  }
  paintTint(); buildBorder();
}
function chaikin(p,it){ for(let k=0;k<it;k++){ if(p.length<3)break; const o=[p[0]];
  for(let i=0;i<p.length-1;i++){ const a=p[i],b=p[i+1]; o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]); }
  o.push(p[p.length-1]); p=o; } return p; }
function buildBorder(){ // 서로 다른 세력 영역 경계 → 실선 Path2D
  const ow=i=>{ const o=owId[i]; return o<0?-1:castles[o].owner; };
  const edges=[]; for(let gy=0;gy<GY;gy++)for(let gx=0;gx<GX;gx++){ const i=gy*GX+gx, a=ow(i); if(a<0)continue;
    if(gx+1<GX){ const b=ow(i+1); if(b>=0&&b!==a) edges.push([gx+1,gy,gx+1,gy+1]); }
    if(gy+1<GY){ const b=ow(i+GX); if(b>=0&&b!==a) edges.push([gx,gy+1,gx+1,gy+1]); } }
  const K=(x,y)=>x+','+y,P=s=>s.split(',').map(Number),EK=(a,b)=>a<b?a+'~'+b:b+'~'+a;
  const adj=new Map(),lk=(a,b)=>{(adj.get(a)||adj.set(a,[]).get(a)).push(b);};
  for(const[ax,ay,bx,by]of edges){const a=K(ax,ay),b=K(bx,by);lk(a,b);lk(b,a);}
  const used=new Set(),lines=[]; const walk=(c,pv,ln,un)=>{ while(1){ const ns=adj.get(c)||[]; let nx=null; for(const z of ns){ if(z===pv)continue; if(!used.has(EK(c,z))){nx=z;break;} } if(!nx)break; used.add(EK(c,nx)); un?ln.unshift(P(nx)):ln.push(P(nx)); pv=c;c=nx; } };
  for(const[ax,ay,bx,by]of edges){ const a=K(ax,ay),b=K(bx,by); if(used.has(EK(a,b)))continue; used.add(EK(a,b)); const ln=[P(a),P(b)]; walk(b,a,ln,0); walk(a,b,ln,1); lines.push(ln); }
  const pa=typeof Path2D!=='undefined'?new Path2D():null;
  if(pa) for(let ln of lines){ ln=chaikin(ln.map(([x,y])=>[x*GC,y*GC]),2); pa.moveTo(ln[0][0],ln[0][1]); for(let k=1;k<ln.length;k++)pa.lineTo(ln[k][0],ln[k][1]); }
  borderPath=pa;
}

// ===== 유닛 =====
let units=[], playerIdx=0, lord=null, state='menu', gold=[];
function tcolor(t){ return t<0?'#9aa':t<NF?FACTIONS[t].color:'#cbd5e1'; }
function power(u){ return Math.pow(Math.max(1,u.troops)/42, Math.log10(4.2)); }
function radius(u){ return 7+Math.min(20,Math.log10(u.troops+10)*4.4); }
function mk(team,x,y,troops,hero,kind){ return {team,x,y,tx:x,ty:y,troops,hero:hero||'',kind:kind||'army',target:null,capC:null}; }
function startGame(idx){
  playerIdx=idx; state='play'; units=[]; gold=new Array(NF).fill(120);
  // 본거지: 서로 먼 정착지 7곳
  const home=[0]; while(home.length<NF){ let bi=0,bd=-1; for(let i=0;i<castles.length;i++){ if(home.includes(i))continue; let md=1e9; for(const h of home)md=Math.min(md,(castles[i].x-castles[h].x)**2+(castles[i].y-castles[h].y)**2); if(md>bd){bd=md;bi=i;} } home.push(bi); }
  home.forEach((ci,f)=>{ const c=castles[ci]; c.owner=f; c.t=Math.max(c.t,4); c.r=TIER[c.t].r; c.fort=Math.max(c.fort,1);
    units.push(mk(f,c.x,c.y,4200,FACTIONS[f].hero,'lord'));
    units.push(mk(f,c.x+34,c.y+30,1400,'',(f===idx?'army':'army'))); });
  lord=units.find(u=>u.team===idx&&u.kind==='lord');
  buildTerritory();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  cam.zoom=clamp(VW()/620, camMin(), 2.4); cam.x=lord.x-VW()/cam.zoom/2; cam.y=lord.y-VH()/cam.zoom/2; clampCam();
}

// ===== 카메라 =====
const cam={x:0,y:0,zoom:1};
function camMin(){ return Math.max(VW()/WW, VH()/WH); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function clampCam(){ cam.zoom=clamp(cam.zoom,camMin(),3); cam.x=clamp(cam.x,0,WW-VW()/cam.zoom); cam.y=clamp(cam.y,0,WH-VH()/cam.zoom); }
function s2w(sx,sy){ return {x:cam.x+sx/cam.zoom, y:cam.y+sy/cam.zoom}; }

// ===== 업데이트 =====
let last=0, terrTimer=0;
function update(dt){
  for(const u of units){ const dx=u.tx-u.x,dy=u.ty-u.y,d=Math.hypot(dx,dy);
    if(d>1.5){ const sp=64*dt; u.x+=dx/d*Math.min(sp,d); u.y+=dy/d*Math.min(sp,d); } }
  // AI
  for(const u of units){ if(u===lord||u.kind==='lord'&&u.team===playerIdx)continue; if(u.team===playerIdx&&u.kind==='lord')continue; aiMove(u); }
  // 전투
  for(let i=0;i<units.length;i++)for(let j=i+1;j<units.length;j++){ const a=units[i],b=units[j]; if(a.team===b.team)continue;
    if(Math.hypot(a.x-b.x,a.y-b.y)<radius(a)+radius(b)+2){ fight(a,b,dt); fight(b,a,dt); } }
  units=units.filter(u=>u.troops>0.5 || u===lord);
  if(lord && lord.troops<=0.5){ lord.troops=0; }
  // 점령
  for(const u of units){ if(u.troops<1) continue; let on=null;
    for(const c of castles){ if(c.owner!==u.team && Math.hypot(c.x-u.x,c.y-u.y)<c.r){ let block=false;
      for(const o of units) if(o.team!==u.team&&Math.hypot(o.x-c.x,o.y-c.y)<c.r){block=true;break;} if(!block){on=c;break;} } }
    if(on){ if(u.capC!==on){u.capC=on;u.capProg=0;} u.capProg+=dt; if(u.capProg>=2.2+on.fort*1.1){ on.owner=u.team; u.capProg=0; u.capC=null; terrTimer=0.01; } }
    else u.capC=null; }
  // 경제
  for(let f=0;f<NF;f++) gold[f]+=dt*3;
  if(terrTimer>0){ terrTimer-=dt; if(terrTimer<=0){ for(let i=0;i<owId.length;i++){ const o=owId[i]; owner[i]=o>=0?castles[o].owner:(owner[i]===-2?-2:-1);} paintTint(); buildBorder(); } }
}
function fight(a,d,dt){ let raw=power(a)-0.5*power(d); if(raw<0.05)raw=0.05; d.troops-=raw*42*0.5*dt*0.6; if(d.troops<0)d.troops=0; }
function aiMove(u){ if(u.troops<1){u.tx=u.x;u.ty=u.y;return;}
  let we=null,wd=320; for(const o of units){ if(o.team===u.team)continue; const dd=Math.hypot(o.x-u.x,o.y-u.y); if(dd<wd&&power(o)<power(u)*1.1){wd=dd;we=o;} }
  if(we){u.tx=we.x;u.ty=we.y;return;}
  let tc=null,cd=1e9; for(const c of castles){ if(c.owner===u.team)continue; const dd=(c.x-u.x)**2+(c.y-u.y)**2; if(dd<cd){cd=dd;tc=c;} }
  if(tc){u.tx=tc.x;u.ty=tc.y;} }

// ===== 렌더 =====
function drawCrest(x,y,R,col){ ctx.beginPath(); for(let i=0;i<16;i++){ const a=Math.PI/8*i-Math.PI/2, rr=i%2?R*.44:R; const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=R*.14; ctx.strokeStyle='#fff8c0'; ctx.stroke(); ctx.beginPath(); ctx.arc(x,y,R*.3,0,7); ctx.fillStyle='#fff8c0'; ctx.fill(); }
function fmt(n){ n=Math.round(n); return n>=10000?(n/10000).toFixed(1)+'만':n>=1000?(n/1000).toFixed(1)+'천':''+n; }
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='#05070c'; ctx.fillRect(0,0,VW(),VH());
  ctx.setTransform(cam.zoom*DPR,0,0,cam.zoom*DPR,-cam.x*cam.zoom*DPR,-cam.y*cam.zoom*DPR);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(land,0,0,WW,WH);                                   // 현실감 지형
  // 영역 세력색(부드러운 업스케일)
  ctx.globalAlpha=.22; ctx.drawImage(tintC,0,0,WW,WH); ctx.globalAlpha=1;
  if(borderPath){ ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.lineWidth=3.2/cam.zoom; ctx.strokeStyle='rgba(248,244,228,.5)'; ctx.stroke(borderPath);
    ctx.lineWidth=1.3/cam.zoom; ctx.strokeStyle='rgba(28,20,12,.9)'; ctx.stroke(borderPath); }
  // 정착지
  for(const c of castles){ const col=tcolor(c.owner);
    ctx.fillStyle='#0d1320'; ctx.strokeStyle=col; ctx.lineWidth=2.4/cam.zoom;
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r*.5,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(c.x,c.y,c.r*.5*.5,0,7); ctx.fill();
    if(cam.zoom>0.5&&c.owner>=0){ ctx.fillStyle='#fff'; ctx.font=`${9/cam.zoom}px sans-serif`; ctx.textAlign='center';
      ctx.fillText(FACTIONS[c.owner].name.slice(0,3), c.x, c.y+c.r*.5+10/cam.zoom); } }
  // 유닛
  for(const u of units){ if(u.troops<1&&u!==lord)continue; const col=tcolor(u.team), R=radius(u);
    ctx.globalAlpha=.9; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(u.x,u.y,R,0,7); ctx.fill(); ctx.globalAlpha=1;
    if(u.kind==='lord'){ ctx.lineWidth=2.4/cam.zoom; ctx.strokeStyle='#fff'; ctx.stroke();
      if(FACTIONS[u.team]&&FACTIONS[u.team].crest) drawCrest(u.x,u.y-R-7/cam.zoom,4.6/cam.zoom,col); }
    ctx.fillStyle='#fff'; ctx.font=`bold ${9/cam.zoom}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=3/cam.zoom; ctx.strokeStyle='#000a'; ctx.strokeText(fmt(u.troops),u.x,u.y-R-4/cam.zoom); ctx.fillText(fmt(u.troops),u.x,u.y-R-4/cam.zoom); }
  // 영주 이동선
  if(lord&&lord.troops>0){ const d=Math.hypot(lord.tx-lord.x,lord.ty-lord.y); if(d>4){ ctx.setLineDash([5/cam.zoom,5/cam.zoom]); ctx.strokeStyle='#ffffff88'; ctx.lineWidth=1.5/cam.zoom; ctx.beginPath(); ctx.moveTo(lord.x,lord.y); ctx.lineTo(lord.tx,lord.ty); ctx.stroke(); ctx.setLineDash([]); } }
  drawMinimap();
  if(state==='play') updateHUD();
}
function drawMinimap(){ ctx.setTransform(DPR,0,0,DPR,0,0);
  const mw=92, mh=mw*WH/WW, mx=VW()-mw-8, my=VH()-mh-22, sx=mw/WW, sy=mh/WH;
  ctx.globalAlpha=.85; ctx.drawImage(land,mx,my,mw,mh); ctx.globalAlpha=1;
  ctx.strokeStyle='#fff9'; ctx.lineWidth=1; ctx.strokeRect(mx,my,mw,mh);
  for(const c of castles){ if(c.owner<0)continue; ctx.fillStyle=tcolor(c.owner); ctx.fillRect(mx+c.x*sx-1,my+c.y*sy-1,2.5,2.5); }
  for(const u of units){ if(u.troops<1)continue; ctx.fillStyle=tcolor(u.team); const s=u.kind==='lord'?3:1.6; ctx.fillRect(mx+u.x*sx-s/2,my+u.y*sy-s/2,s,s); }
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(mx+cam.x*sx,my+cam.y*sy,VW()/cam.zoom*sx,VH()/cam.zoom*sy);
}
function updateHUD(){ const f=FACTIONS[playerIdx]; let mine=0; for(const c of castles)if(c.owner===playerIdx)mine++;
  document.getElementById('hFac').textContent=(f.crest?'✦ ':'')+f.name+' · '+f.hero;
  document.getElementById('hTroops').textContent='⚔ '+fmt(lord?lord.troops:0);
  document.getElementById('hGold').textContent='💰 '+Math.floor(gold[playerIdx]||0);
  document.getElementById('hCastle').textContent='🏰 '+mine;
}

// ===== 입력 =====
let drag=null, pinch=null, moved=false;
cv.addEventListener('touchstart',e=>{ e.preventDefault();
  if(e.touches.length===2){ pinch={d:tdist(e),z:cam.zoom}; drag=null; }
  else { drag={x:e.touches[0].clientX,y:e.touches[0].clientY,cx:cam.x,cy:cam.y}; moved=false; } },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault();
  if(pinch&&e.touches.length===2){ const nd=tdist(e); const ox=(e.touches[0].clientX+e.touches[1].clientX)/2,oy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const w=s2w(ox,oy); cam.zoom=clamp(pinch.z*nd/pinch.d,camMin(),3); cam.x=w.x-ox/cam.zoom; cam.y=w.y-oy/cam.zoom; clampCam(); }
  else if(drag){ const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    cam.x=drag.cx-dx/cam.zoom; cam.y=drag.cy-dy/cam.zoom; clampCam(); } },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault();
  if(pinch){pinch=null;return;} if(drag&&!moved&&state==='play'&&lord&&lord.troops>0){ const w=s2w(drag.x,drag.y); lord.tx=clamp(w.x,4,WW-4); lord.ty=clamp(w.y,4,WH-4); } drag=null; },{passive:false});
function tdist(e){ return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }
// 마우스(데스크탑 미리보기)
let md=null; cv.addEventListener('mousedown',e=>{md={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};moved=false;});
addEventListener('mousemove',e=>{ if(!md)return; const dx=e.clientX-md.x,dy=e.clientY-md.y; if(Math.abs(dx)+Math.abs(dy)>6)moved=true; cam.x=md.cx-dx/cam.zoom; cam.y=md.cy-dy/cam.zoom; clampCam(); });
addEventListener('mouseup',e=>{ if(md&&!moved&&state==='play'&&lord&&lord.troops>0){ const w=s2w(e.clientX,e.clientY); lord.tx=clamp(w.x,4,WW-4); lord.ty=clamp(w.y,4,WH-4);} md=null; });
addEventListener('wheel',e=>{ const w=s2w(e.clientX,e.clientY); cam.zoom=clamp(cam.zoom*(e.deltaY<0?1.1:0.9),camMin(),3); cam.x=w.x-e.clientX/cam.zoom; cam.y=w.y-e.clientY/cam.zoom; clampCam(); },{passive:true});

// ===== 시작 화면 =====
function buildMenu(){ const fl=document.getElementById('fl');
  FACTIONS.forEach((f,i)=>{ const b=document.createElement('button'); b.className='fb'; b.style.background=f.color;
    b.style.color=['#f5d442','#84cc16','#38bdf8','#94a3b8'].includes(f.color)?'#10151f':'#fff';
    b.innerHTML=(f.crest?'✦ ':'')+f.name+'<small>영웅 '+f.hero+' — '+f.desc+'</small>'; b.onclick=()=>startGame(i); fl.appendChild(b); }); }

// ===== 루프 =====
function loop(t){ const dt=Math.min(0.05,(t-last)/1000)||0; last=t; if(state==='play') update(dt); draw(); requestAnimationFrame(loop); }
genWorld(); placeCastles(); buildTerritory(); buildMenu();
cam.x=0;cam.y=0;cam.zoom=camMin(); requestAnimationFrame(loop);
</script>
</body>
