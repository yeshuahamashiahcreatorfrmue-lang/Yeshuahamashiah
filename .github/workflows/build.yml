name: Build Tsukuru Engine

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- Windows: produces the double-clickable .exe ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Stage release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item bin/Release/TsukuruEngine.exe dist/ -ErrorAction SilentlyContinue
          if (!(Test-Path dist/TsukuruEngine.exe)) { Copy-Item bin/TsukuruEngine.exe dist/ }
          Copy-Item -Recurse assets   dist/assets
          Copy-Item -Recurse projects dist/projects
          Copy-Item README.md dist/
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TsukuruEngine-Windows
          path: dist

  # ---------- Linux: builds engine + runs the headless self-test ----------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev xvfb
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4
      - name: Run self-test
        run: ./bin/tsukuru_selftest
      - name: Smoke-test the engine (headless)
        run: xvfb-run -a ./bin/TsukuruEngine projects/sample_rpg --frames 60
