name: Windows Build & Smoke Test

# Builds the engine on a REAL Windows runner (no GPU -> only OpenGL 1.1, which
# reproduces the "instantly closes" problem), then proves it runs once the
# bundled Mesa software OpenGL is placed next to the exe. Produces a ready-to-run
# Windows package as an artifact.
on:
  push:
    branches: [ "claude/tsukuru-engine-assets-6nrjkk" ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX Runtime + AI model (phone-grade subject cut-out)
        shell: pwsh
        run: |
          $ortVer = "1.17.3"
          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVer/onnxruntime-win-x64-$ortVer.zip"
          Invoke-WebRequest -Uri $ortUrl -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort -Force
          $root = (Get-ChildItem ort -Directory | Select-Object -First 1).FullName
          echo "ORT_ROOT=$root" >> $env:GITHUB_ENV
          Write-Host "ONNX Runtime at: $root"
          # U^2-Net (u2netp) foreground-matte model (~4.6 MB).
          $modelUrl = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx"
          Invoke-WebRequest -Uri $modelUrl -OutFile u2netp.onnx
          Write-Host "Model size: $((Get-Item u2netp.onnx).Length) bytes"

      - name: Configure (CMake, OpenGL 2.1, AI cut-out)
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DOPENGL_VERSION=2.1' "-DONNXRUNTIME_ROOT=$env:ORT_ROOT"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Locate exe
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build,bin -Recurse -Filter TsukuruEngine.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "TsukuruEngine.exe not found" }
          echo "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          Write-Host "Found: $($exe.FullName)"
          # Ship the AI model next to the exe so the engine loads it at startup.
          Copy-Item u2netp.onnx $exe.DirectoryName -Force
          Get-ChildItem $exe.DirectoryName

      - name: Smoke test WITHOUT software GL (expected to fail on GPU-less runner)
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = "${{ steps.find.outputs.dir }}"
          $exe = "${{ steps.find.outputs.exe }}"
          Push-Location $dir
          $p = Start-Process -FilePath $exe -ArgumentList "--frames","30","--shot","shot_nogl.png" -Wait -PassThru
          Write-Host "Exit code (no software GL): $($p.ExitCode)"
          if (Test-Path tsukuru_log.txt) { Write-Host "----- LOG -----"; Get-Content tsukuru_log.txt }
          Pop-Location

      - name: Download Mesa software OpenGL (llvmpipe)
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.2/mesa3d-26.1.2-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z e mesa.7z "x64/opengl32.dll" "x64/libgallium_wgl.dll" -o"${{ steps.find.outputs.dir }}" -y
          Get-ChildItem "${{ steps.find.outputs.dir }}" -Filter *.dll

      - name: Smoke test WITH software GL (must succeed)
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $dir = "${{ steps.find.outputs.dir }}"
          $exe = "${{ steps.find.outputs.exe }}"
          Push-Location $dir
          Remove-Item tsukuru_log.txt -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList "--frames","40","--shot","shot_softgl.png" -Wait -PassThru
          Write-Host "Exit code (editor): $($p.ExitCode)"
          if (Test-Path tsukuru_log.txt) { Write-Host "----- EDITOR LOG -----"; Get-Content tsukuru_log.txt }
          if ($p.ExitCode -ne 0) { throw "Engine did not exit cleanly on real Windows (rc=$($p.ExitCode))" }
          if (-not (Test-Path shot_softgl.png)) { throw "No screenshot produced -> did not actually render" }

          # PLAY MODE test: jump straight into the game and auto-walk the player.
          Remove-Item tsukuru_log.txt -ErrorAction SilentlyContinue
          $env:TSUKURU_AUTOWALK = "1"
          $p2 = Start-Process -FilePath $exe -ArgumentList "--start","play","--frames","120","--shot","play_softgl.png" -Wait -PassThru
          Write-Host "Exit code (play): $($p2.ExitCode)"
          if (Test-Path tsukuru_log.txt) { Write-Host "----- PLAY LOG -----"; Get-Content tsukuru_log.txt }
          if ($p2.ExitCode -ne 0) { throw "Play mode did not exit cleanly (rc=$($p2.ExitCode))" }
          if (-not (Test-Path play_softgl.png)) { throw "No play screenshot -> play did not render" }
          $walks = (Select-String -Path tsukuru_log.txt -Pattern "AUTOWALK arrived").Count
          Write-Host "Player auto-walk steps: $walks"
          if ($walks -lt 1) { throw "Player did not move in play mode" }
          Write-Host "SUCCESS: engine ran, rendered, and the player moved on real Windows."
          Pop-Location

      - name: Screenshot 캐릭터 tab on real Windows
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          TSUKURU_TAB: chars
        run: |
          $dir = "${{ steps.find.outputs.dir }}"
          $exe = "${{ steps.find.outputs.exe }}"
          Push-Location $dir
          $p = Start-Process -FilePath $exe -ArgumentList "--start","editor","--frames","24","--shot","shot_chars.png" -Wait -PassThru
          Write-Host "chars-tab shot exit: $($p.ExitCode)"
          if (-not (Test-Path shot_chars.png)) { throw "no chars screenshot" }
          Pop-Location

      - name: Stage release package
        shell: pwsh
        run: |
          $dir = "${{ steps.find.outputs.dir }}"
          $out = "TsukuruEngine-Windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$dir\TsukuruEngine.exe" $out
          Copy-Item "$dir\opengl32.dll" $out
          Copy-Item "$dir\libgallium_wgl.dll" $out
          # AI subject cut-out runtime + model (bundled so it works out of the box).
          Copy-Item "$dir\onnxruntime.dll" $out -ErrorAction SilentlyContinue
          Get-ChildItem "$dir" -Filter "onnxruntime*.dll" | ForEach-Object { Copy-Item $_.FullName $out -Force }
          Copy-Item "$dir\u2netp.onnx" $out -ErrorAction SilentlyContinue
          Copy-Item "$dir\assets" $out -Recurse -Force
          Copy-Item "$dir\projects" $out -Recurse -Force
          if (Test-Path "$dir\shot_softgl.png") { Copy-Item "$dir\shot_softgl.png" $out }
          if (Test-Path "$dir\play_softgl.png") { Copy-Item "$dir\play_softgl.png" $out }
          Copy-Item "README.md" $out -ErrorAction SilentlyContinue
          Copy-Item "packaging\*" $out -Force -ErrorAction SilentlyContinue
          Get-ChildItem $out -Recurse | Select-Object FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TsukuruEngine-Windows
          path: TsukuruEngine-Windows/**

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-logs
          path: |
            ${{ steps.find.outputs.dir }}/shot_*.png
            ${{ steps.find.outputs.dir }}/tsukuru_log.txt
